name: Pass 45 BTR4 material state

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
  pull_request:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify BTR4 pre/post-possession material state
        run: python VERIFY_PASS45_BTR4_MATERIAL_STATE.py
