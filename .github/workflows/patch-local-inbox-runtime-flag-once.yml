name: one-shot local inbox runtime flag patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-local-inbox-runtime-flag-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch launcher and remove this workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('RUN_R14_CURRENT_GAMEPLAY.cmd')
          text = p.read_text(encoding='utf-8-sig')

          marker = 'set "RHI_MODE=dx11_sm5_rhi_thread"'
          insert = '''set "RHI_MODE=dx11_sm5_rhi_thread"\nset "LOCAL_INBOX_FLAG="\nif /I "%OC_VALIDATE_LOCAL_INBOX%"=="1" set "LOCAL_INBOX_FLAG=-ValidateLocalInbox"'''
          if 'LOCAL_INBOX_FLAG' not in text:
              if marker not in text:
                  raise SystemExit('RHI marker not found')
              text = text.replace(marker, insert, 1)

          old = ' %RHI_FLAGS% -NoScreenMessages -log '
          new = ' %RHI_FLAGS% %LOCAL_INBOX_FLAG% -NoScreenMessages -log '
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('game launch marker not found')

          p.write_text(text, encoding='utf-8', newline='\r\n')
          Path('.github/workflows/patch-local-inbox-runtime-flag-once.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RUN_R14_CURRENT_GAMEPLAY.cmd .github/workflows/patch-local-inbox-runtime-flag-once.yml
          git commit -m "Pass45: pass local inbox validation into runtime"
          git push origin main
