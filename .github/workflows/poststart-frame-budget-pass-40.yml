name: Post-start frame budget Pass 40

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/poststart-frame-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poststart-frame-budget-pass-40-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-40:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 40 post-start frame budget
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_POSTSTART_FRAME_BUDGET_PASS_40.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_RUNTIME_ACCEPTANCE_PASS_33.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
