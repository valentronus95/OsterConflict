name: Pass 45 item16 production cutover preflight

on:
  pull_request:
    paths:
      - 'VERIFY_PASS45_ITEM16_PRODUCTION_CUTOVER_PREFLIGHT.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - '_DOCS/PASS45_ITEM16_MANUAL_ACTION_CALIBRATION_APPROVAL.json'
      - '.github/workflows/pass45-item16-production-cutover-preflight.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production cutover preflight
        run: python -m py_compile VERIFY_PASS45_ITEM16_PRODUCTION_CUTOVER_PREFLIGHT.py
      - name: Verify fail-closed item16 production cutover boundary
        run: python VERIFY_PASS45_ITEM16_PRODUCTION_CUTOVER_PREFLIGHT.py
