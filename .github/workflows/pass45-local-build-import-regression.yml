name: Pass 45 local build import regression

on:
  pull_request:
    paths:
      - 'START_HERE.cmd'
      - 'RUN_PASS45_BATCH_RUNTIME_TEST.cmd'
      - 'OsterConflict/Scripts/run_pass45_batch_runtime_test.ps1'
      - 'OsterConflict/Source/OsterConflict/Private/OCTacticalMapVisual.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCPlayerController.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCLocalInboxWeaponOverrideSubsystem.cpp'
      - 'OsterConflict/Scripts/import_production_vehicle_assets.py'
      - 'OsterConflict/Scripts/prepare_all_local_inbox_assets.ps1'
      - 'OsterConflict/Scripts/import_all_local_inbox_assets.py'
      - 'OsterConflict/Scripts/normalize_local_weapon_categories.py'
      - 'OsterConflict/Scripts/finalize_asset_acceptance.py'
      - 'OsterConflict/IMPORT_ALL_LOCAL_INBOX_UE58.cmd'
      - 'COLLECT_LOCAL_ASSET_STATUS.py'
      - 'VERIFY_PASS45_LOCAL_BUILD_IMPORT_REGRESSION.py'
      - 'VERIFY_PASS45_SANDBOX_WEAPON_RACK.py'
      - 'VERIFY_PASS45_ASSET_SOURCE_CLEAN_GUARD.py'
      - 'VERIFY_PASS45_ASSET_FINALIZATION_GUARD.py'
      - 'OSTER_CONFLICT_WORK_LEDGER.md'
      - 'PASS45_RUNTIME_RECOVERY_TZ.md'
      - 'RUN_ALL_VERIFY.py'
      - '.github/workflows/pass45-local-build-import-regression.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify local UE build/import regression guards
        run: python VERIFY_PASS45_LOCAL_BUILD_IMPORT_REGRESSION.py
      - name: Verify sandbox all-weapons rack
        run: python VERIFY_PASS45_SANDBOX_WEAPON_RACK.py
      - name: Verify asset source clean guard
        run: python VERIFY_PASS45_ASSET_SOURCE_CLEAN_GUARD.py
      - name: Verify manual visual acceptance and ZIP cleanup guard
        run: python VERIFY_PASS45_ASSET_FINALIZATION_GUARD.py
