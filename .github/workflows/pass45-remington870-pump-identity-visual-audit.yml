name: Pass 45 Remington 870 pump identity visual audit

on:
  pull_request:
    paths:
      - 'PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py'
      - 'VERIFY_PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py'
      - 'PASS45_REMINGTON870_REMOTE_CANDIDATE_AUDIT.py'
      - 'PASS45_REMINGTON870_SOURCE_ACQUIRE.py'
      - 'PASS45_REMINGTON870_STRUCTURE_AUDIT.py'
      - 'SOURCE_ASSETS/PASS45/Remington870/MANIFEST.json'
      - '_DOCS/THIRD_PARTY_CODE_AND_ASSET_REGISTER.md'
      - '.github/workflows/pass45-remington870-pump-identity-visual-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile visual audit
        run: python -m py_compile PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py VERIFY_PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py
      - name: Verify fail-closed visual audit contract
        run: python VERIFY_PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py
      - name: Generate exact-donor bind-pose visual evidence
        run: |
          mkdir -p _pass45_visual_evidence
          python PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.py \
            --output-json _pass45_visual_evidence/PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.json \
            --output-svg _pass45_visual_evidence/PASS45_REMINGTON870_PUMP_IDENTITY_VISUAL_AUDIT.svg
      - name: Upload visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: pass45-remington870-pump-identity-visual-evidence
          path: _pass45_visual_evidence/
          if-no-files-found: error
          retention-days: 14
