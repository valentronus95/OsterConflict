name: Pass 45 M700 source motion audit

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
    paths:
      - 'OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
      - 'PASS45_M700_SOURCE_MOTION_AUDIT.py'
      - '.github/workflows/pass45-m700-source-motion-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-raw-m700-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Oster head without bulk LFS payload download
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Materialize only the pinned Stein M700 FBX
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
          git lfs install --local
          git lfs pull --include="$SOURCE" --exclude=''
          test -f "$SOURCE"
          if head -c 64 "$SOURCE" | grep -q 'git-lfs.github.com/spec'; then
            echo 'PASS45_M700_SOURCE_MOTION_AUDIT_LFS_POINTER_UNRESOLVED'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx')
          payload = source.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          if len(payload) != 638732:
              raise SystemExit(f'M700 FBX size drifted: {len(payload)}')
          if digest != 'b7e003e01be8441e452730bc06c38c5e9752e523ae1b401ed2a6cc6cdca16840':
              raise SystemExit(f'M700 FBX SHA-256 drifted: {digest}')
          print(f'PASS45_M700_PINNED_SOURCE_OK size={len(payload)} sha256={digest}')
          PY

      - name: Install deterministic FBX inspection converter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends assimp-utils
          assimp version

      - name: Convert exact FBX to inspection-only glTF2 and audit structure/motion
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
          GLTF='/tmp/pass45_m700_source_audit.gltf'
          OUTPUT='_DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json'
          assimp export "$SOURCE" "$GLTF" -f gltf2
          test -s "$GLTF"
          python PASS45_M700_SOURCE_MOTION_AUDIT.py --source "$SOURCE" --gltf "$GLTF" --output "$OUTPUT"
          cat "$OUTPUT"

      - name: Commit factual audit report only if canonical head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='_DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json'
          git add "$OUTPUT"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$REMOTE_HEAD" != "$GITHUB_SHA" ]]; then
            echo "PASS45_M700_SOURCE_MOTION_AUDIT_HEAD_MOVED expected=$GITHUB_SHA actual=$REMOTE_HEAD"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'PASS45_M700_SOURCE_MOTION_AUDIT_NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(pass45): persist M700 raw source motion audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve M700 source-motion audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass45-m700-source-motion-audit
          path: _DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json
          if-no-files-found: error
          retention-days: 3
