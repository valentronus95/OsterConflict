name: Pass45 sync residential retirement docs

on:
  push:
    branches:
      - fix/runtime-acceptance-pass45-generic-residential-retirement-20260826
    paths:
      - '.github/workflows/_pass45_sync_reference_residential_docs.yml'

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/runtime-acceptance-pass45-generic-residential-retirement-20260826
          fetch-depth: 0
      - name: Update canonical Pass45 status with exact guards
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          tz = Path('PASS45_RUNTIME_RECOVERY_TZ.md')
          ledger = Path('OSTER_CONFLICT_WORK_LEDGER.md')

          replace_once(tz,
              'Status: **PASS 45 ACTIVE / RUNTIME REJECTED 2026-08-25 / CORRECTIVE WORK IN PROGRESS**\nActive corrective branch: `fix/pass45-runtime-rejection-20260825`\n',
              'Status: **PASS 45 ACTIVE / RUNTIME REJECTED 2026-08-25 / SOURCE CONTINUATION CODED_UNTESTED**\nActive corrective branch: `fix/runtime-acceptance-pass45-generic-residential-retirement-20260826`\nActive continuation PR: #91\n',
              'TZ active branch/status')

          replace_once(tz,
              '- no arbitrary decorative building family may be introduced outside the accepted topology/reference set.\n\nAcceptance:\n',
              '- no arbitrary decorative building family may be introduced outside the accepted topology/reference set.\n\nSource retirement continuation — 2026-08-26, PR #91, **CODED_UNTESTED**:\n\n- normal runtime no longer spawns the explicitly non-reference-specific `AOCEnterableHouse`;\n- `BuildResidentialBlocks()` procedural house/shed/private-fence grid owner is physically removed from `AOCWorldSectorOster`;\n- the generic `BuildSolomiiKrushelnytskoiStreet()` house/shed/fence generator is physically removed; road topology remains owned by `BuildRoadNetwork()`;\n- Museum/Stadium/College reference-driven fence geometry remains;\n- `VERIFY_PASS45_REFERENCE_DRIVEN_RESIDENTIAL_RETIREMENT.py` prevents silent resurrection of those generic owners;\n- runtime absence of the previously observed dark tower/shack remains Gate E evidence and is not claimed from source alone.\n\nAcceptance:\n',
              'TZ P1 residential source closure')

          replace_once(tz,
              '11. [ ] Remove unreferenced tower/shack and any remaining rejected generic fence/house visuals.\n',
              '11. [x] Source-retire the traced unreferenced generic house/fence owners (`AOCEnterableHouse` normal spawn, `BuildResidentialBlocks`, generic Krushelnytska house generator); **CODED_UNTESTED**, and runtime Gate E still must prove the dark tower/shack artifact is absent.\n',
              'TZ execution item 11')

          replace_once(tz,
              '- Corrective source work now includes stale-owner physical retirement, initial-only Museum BASE recovery, proportional HMMWV/BTR fitting, M2 mount alignment, fullscreen + 60 FPS recovery guard.\n- Current branch: `fix/pass45-runtime-rejection-20260825`.\n',
              '- Corrective source work now includes stale-owner physical retirement, initial-only Museum BASE recovery, proportional HMMWV/BTR fitting, M2 mount alignment, fullscreen + 60 FPS recovery guard, and source retirement of unreferenced generic residential visual owners.\n- Current branch: `fix/runtime-acceptance-pass45-generic-residential-retirement-20260826` (PR #91).\n',
              'TZ current status summary')

          replace_once(ledger,
              '## 1. Current context — 2026-08-25\n\n- Repository: `valentronus95/OsterConflict`.\n- `main` runtime baseline before current corrective branch: `1d6f57227bb15e84d7df911c192f53685b08544f` (PR #82).\n- Active corrective branch: `fix/pass45-runtime-rejection-20260825`.\n- Corrective PR: #83, **NOT MERGED** until current-head source CI is green.\n',
              '## 1. Current context — 2026-08-26\n\n- Repository: `valentronus95/OsterConflict`.\n- Current `main` baseline before this continuation: `a375f52635fbe9fa07c1000aa706e28c53eb42f4` (PR #89 merged).\n- Active corrective branch: `fix/runtime-acceptance-pass45-generic-residential-retirement-20260826`.\n- Active continuation PR: #91, **NOT MERGED** until current-head source CI is green.\n',
              'ledger current context')

          replace_once(ledger,
              '`RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd` is forward-ported to current initial-only Museum deployment markers and may not treat vehicle possession as a new BASE deployment.\n\n## 5. Active requirements\n',
              '`RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd` is forward-ported to current initial-only Museum deployment markers and may not treat vehicle possession as a new BASE deployment.\n\n### 4.7 Reference-driven residential visual retirement — 2026-08-26\n\nCurrent status: **CODED_UNTESTED**.\n\n- normal `OCGameMode` no longer spawns the gameplay-authored/non-reference-specific `AOCEnterableHouse`;\n- `AOCWorldSectorOster` no longer owns `BuildResidentialBlocks()` procedural houses/sheds/private fences;\n- the generic Krushelnytska house/shed/fence generator is physically removed while `BuildRoadNetwork()` retains road topology;\n- Museum/Stadium/College reference-driven fence geometry remains;\n- runtime markers: `PASS45_GENERIC_ENTERABLE_HOUSE_RETIRED` and `PASS45_WORLD_GENERIC_RESIDENTIAL_RETIRED`;\n- `VERIFY_PASS45_REFERENCE_DRIVEN_RESIDENTIAL_RETIREMENT.py` + workflow guard against resurrection;\n- old Pass11 road verifier was forward-ported when CI exposed stale dependencies on already-deleted `OCAssetModelDecorator` / `OCRecoveredRoadsidePropsSubsystem`; those deleted owners are not restored.\n\nRuntime still must prove the rejected dark tower/shack and generic visual family are absent.\n\n## 5. Active requirements\n',
              'ledger section 4.7')

          replace_once(ledger,
              '| LOC-TOWER-001 | Remove unreferenced dark steep-roof tower/shack | 1 | CODED_UNTESTED / INVESTIGATE | Pass35 recovery carrier/roof owner removed; trace if artifact remains next runtime. |\n',
              '| LOC-TOWER-001 | Remove unreferenced dark steep-roof tower/shack | 1 | CODED_UNTESTED / RUNTIME CHECK | Pass35 roof/recovery owner plus traced generic residential source owners are removed; next runtime must prove the artifact is absent. |\n| VIS-GENERIC-RESIDENTIAL-001 | No unreferenced generic house/private-fence family in normal runtime | 1 | CODED_UNTESTED | `AOCEnterableHouse` normal spawn, `BuildResidentialBlocks`, and generic Krushelnytska house/fence generator retired; reference-driven POI fences retained. |\n',
              'ledger active generic residential requirements')

          replace_once(ledger,
              '16. production vehicle material repair that hides a primary material-owner bug.\n',
              '16. production vehicle material repair that hides a primary material-owner bug;\n17. procedural `BuildResidentialBlocks`, generic Krushelnytska house/fence generation, or normal spawn of a non-reference-specific `AOCEnterableHouse`.\n',
              'ledger forbidden behavior')

          replace_once(ledger,
              '18. [ ] Trace/remove any remaining unreferenced tower/shack or rejected generic near-Museum visual.\n19. [ ] Complete full current-head source CI; forward-port remaining stale verifier instead of restoring old behavior.\n20. [ ] Refresh PR #83 summary/check state after source scope is coherent.\n',
              '18. [x] Source-trace and retire remaining generic residential house/fence owners; dark tower/shack absence remains a factual runtime gate.\n19. [ ] Complete full current-head source CI; forward-port remaining stale verifier instead of restoring old behavior.\n20. [x] Refresh active continuation as PR #91 with source scope and `CODED_UNTESTED` status.\n',
              'ledger execution continuation')

          print('PASS45_DOC_SYNC=PASS')
          PY
      - name: Commit docs and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/_pass45_sync_reference_residential_docs.yml
          git config user.name "Pass45 Ledger Guard"
          git config user.email "actions@users.noreply.github.com"
          git add PASS45_RUNTIME_RECOVERY_TZ.md OSTER_CONFLICT_WORK_LEDGER.md .github/workflows/_pass45_sync_reference_residential_docs.yml
          git diff --cached --check
          git commit -m "docs(pass45): record generic residential owner retirement"
          git push origin HEAD:fix/runtime-acceptance-pass45-generic-residential-retirement-20260826
