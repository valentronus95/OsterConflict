name: Silpo Oster location contracts

on:
  push:
    branches:
      - main
      - silpo-oster
    paths:
      - '.github/workflows/silpo-location-contracts.yml'
      - 'OsterConflict/Tools/validate_silpo_location.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCGeoReference.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCGeoReference.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR140SilpoPhotoModelSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR140SilpoPhotoModelSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR141SilpoDetailSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR141SilpoDetailSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR142SilpoInteriorDetailSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR142SilpoInteriorDetailSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR143SilpoFacadeIdentitySubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR143SilpoFacadeIdentitySubsystem.h'
      - 'OsterConflict/Docs/Locations/SILPO_OSTER_*.md'
      - 'OsterConflict/SourceReferences/Locations/Silpo_Oster/**'
      - 'REFERENCE_PHOTOS/silpo_oster/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/silpo-location-contracts.yml'
      - 'OsterConflict/Tools/validate_silpo_location.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCGeoReference.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCGeoReference.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR140SilpoPhotoModelSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR140SilpoPhotoModelSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR141SilpoDetailSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR141SilpoDetailSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR142SilpoInteriorDetailSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR142SilpoInteriorDetailSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR143SilpoFacadeIdentitySubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR143SilpoFacadeIdentitySubsystem.h'
      - 'OsterConflict/Docs/Locations/SILPO_OSTER_*.md'
      - 'OsterConflict/SourceReferences/Locations/Silpo_Oster/**'
      - 'REFERENCE_PHOTOS/silpo_oster/**'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate Silpo location contracts
        run: python OsterConflict/Tools/validate_silpo_location.py
