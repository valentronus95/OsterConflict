name: Slate render target startup Pass 43

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/slate-render-target-*'
  workflow_dispatch:

jobs:
  verify-pass-43:
    runs-on: windows-latest
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Slate-safe startup graphics lifecycle
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_SLATE_RENDER_TARGET_STARTUP_PASS_43.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_RUNTIME_GRAPHICS_PASS_16.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
