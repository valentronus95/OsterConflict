name: Pass45 vehicle transform trace patch

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-20260825
    paths:
      - .github/workflows/pass45-vehicle-transform-trace-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass45-runtime-rejection-20260825
          fetch-depth: 0

      - name: Add driver and gunner transform evidence
        shell: python
        run: |
          from pathlib import Path

          vehicle_path = Path('OsterConflict/Source/OsterConflict/Private/OCVehicleBase.cpp')
          vehicle = vehicle_path.read_text(encoding='utf-8')

          old_enter = '''    DriverCharacter = Character;
              Character->EnterVehicleServer(this);
              SetOwner(OccupantController);
              OccupantController->Possess(this);
              ForceNetUpdate();
              return true;'''.replace('              ', '    ')
          new_enter = '''    const FVector VehicleLocationBeforeEnter = GetActorLocation();
              const FVector CharacterLocationBeforeEnter = Character->GetActorLocation();
              DriverCharacter = Character;
              Character->EnterVehicleServer(this);
              SetOwner(OccupantController);
              OccupantController->Possess(this);
              ForceNetUpdate();
          
              const float VehicleEnterDriftCm = FVector::Dist(VehicleLocationBeforeEnter, GetActorLocation());
              if (VehicleEnterDriftCm <= 5.0f)
              {
                  UE_LOG(LogTemp, Display,
                      TEXT("PASS45_VEHICLE_ENTER_TRANSFORM_READY vehicle=%s vehicle_before=%s vehicle_after=%s character_before=%s vehicle_drift_cm=%.1f museum_respawn_path=0"),
                      *GetName(),
                      *VehicleLocationBeforeEnter.ToCompactString(),
                      *GetActorLocation().ToCompactString(),
                      *CharacterLocationBeforeEnter.ToCompactString(),
                      VehicleEnterDriftCm);
              }
              else
              {
                  UE_LOG(LogTemp, Error,
                      TEXT("PASS45_VEHICLE_ENTER_TRANSFORM_FAIL vehicle=%s vehicle_before=%s vehicle_after=%s vehicle_drift_cm=%.1f"),
                      *GetName(),
                      *VehicleLocationBeforeEnter.ToCompactString(),
                      *GetActorLocation().ToCompactString(),
                      VehicleEnterDriftCm);
              }
              return true;'''.replace('              ', '    ')
          if old_enter not in vehicle:
              raise SystemExit('driver enter signature not found')
          vehicle = vehicle.replace(old_enter, new_enter, 1)

          old_exit = '''    const FVector ExitLocation = FindSafeExitLocationForCharacter(Character, -1.0f, bForced);
              const FRotator ExitRotation(0.0f, GetActorRotation().Yaw, 0.0f);
          
              ThrottleInput = 0.0f;
              SteeringInput = 0.0f;
              bHandbrake = true;
              OccupantController->UnPossess();
              Character->ExitVehicleServer(ExitLocation, ExitRotation);
              DriverCharacter = nullptr;
              SetOwner(nullptr);
              OccupantController->Possess(Character);
              ForceNetUpdate();'''.replace('              ', '    ')
          new_exit = '''    const FVector VehicleLocationAtExit = GetActorLocation();
              const FVector ExitLocation = FindSafeExitLocationForCharacter(Character, -1.0f, bForced);
              const FRotator ExitRotation(0.0f, GetActorRotation().Yaw, 0.0f);
          
              ThrottleInput = 0.0f;
              SteeringInput = 0.0f;
              bHandbrake = true;
              OccupantController->UnPossess();
              Character->ExitVehicleServer(ExitLocation, ExitRotation);
              DriverCharacter = nullptr;
              SetOwner(nullptr);
              OccupantController->Possess(Character);
              ForceNetUpdate();
          
              const FVector ResultingPawnLocation = Character->GetActorLocation();
              const float ExitErrorCm = FVector::Dist(ResultingPawnLocation, ExitLocation);
              const float PawnToVehicleCm = FVector::Dist(ResultingPawnLocation, VehicleLocationAtExit);
              if (ExitErrorCm <= 100.0f)
              {
                  UE_LOG(LogTemp, Display,
                      TEXT("PASS45_VEHICLE_EXIT_TRANSFORM_READY vehicle=%s vehicle_location=%s requested_exit=%s resulting_pawn=%s result_error_cm=%.1f pawn_to_vehicle_m=%.1f museum_respawn_path=0"),
                      *GetName(),
                      *VehicleLocationAtExit.ToCompactString(),
                      *ExitLocation.ToCompactString(),
                      *ResultingPawnLocation.ToCompactString(),
                      ExitErrorCm,
                      PawnToVehicleCm / 100.0f);
              }
              else
              {
                  UE_LOG(LogTemp, Error,
                      TEXT("PASS45_VEHICLE_EXIT_TRANSFORM_FAIL vehicle=%s vehicle_location=%s requested_exit=%s resulting_pawn=%s result_error_cm=%.1f museum_respawn_path=0"),
                      *GetName(),
                      *VehicleLocationAtExit.ToCompactString(),
                      *ExitLocation.ToCompactString(),
                      *ResultingPawnLocation.ToCompactString(),
                      ExitErrorCm);
              }'''.replace('              ', '    ')
          if old_exit not in vehicle:
              raise SystemExit('driver exit signature not found')
          vehicle = vehicle.replace(old_exit, new_exit, 1)
          vehicle_path.write_text(vehicle, encoding='utf-8')

          armed_path = Path('OsterConflict/Source/OsterConflict/Private/OCArmedVehicleBase.cpp')
          armed = armed_path.read_text(encoding='utf-8')
          old_gunner = '''    AOCCharacter* Character = GunnerCharacter;
              GunnerCharacter = nullptr;
              if (!HasDriver()) OccupantTeam = EOCTeam::None;
              const FVector ExitLocation = FindSafeExitLocationForCharacter(Character, 1.0f, bForced);
              Character->ExitVehicleGunnerServer(ExitLocation, FRotator(0.0f, GetActorRotation().Yaw, 0.0f));
              ForceNetUpdate();
              return true;'''.replace('              ', '    ')
          new_gunner = '''    AOCCharacter* Character = GunnerCharacter;
              GunnerCharacter = nullptr;
              if (!HasDriver()) OccupantTeam = EOCTeam::None;
              const FVector VehicleLocationAtExit = GetActorLocation();
              const FVector ExitLocation = FindSafeExitLocationForCharacter(Character, 1.0f, bForced);
              Character->ExitVehicleGunnerServer(ExitLocation, FRotator(0.0f, GetActorRotation().Yaw, 0.0f));
              ForceNetUpdate();
          
              const FVector ResultingPawnLocation = Character->GetActorLocation();
              const float ExitErrorCm = FVector::Dist(ResultingPawnLocation, ExitLocation);
              const float PawnToVehicleCm = FVector::Dist(ResultingPawnLocation, VehicleLocationAtExit);
              if (ExitErrorCm <= 100.0f)
              {
                  UE_LOG(LogTemp, Display,
                      TEXT("PASS45_GUNNER_EXIT_TRANSFORM_READY vehicle=%s vehicle_location=%s requested_exit=%s resulting_pawn=%s result_error_cm=%.1f pawn_to_vehicle_m=%.1f museum_respawn_path=0"),
                      *GetName(),
                      *VehicleLocationAtExit.ToCompactString(),
                      *ExitLocation.ToCompactString(),
                      *ResultingPawnLocation.ToCompactString(),
                      ExitErrorCm,
                      PawnToVehicleCm / 100.0f);
              }
              else
              {
                  UE_LOG(LogTemp, Error,
                      TEXT("PASS45_GUNNER_EXIT_TRANSFORM_FAIL vehicle=%s vehicle_location=%s requested_exit=%s resulting_pawn=%s result_error_cm=%.1f museum_respawn_path=0"),
                      *GetName(),
                      *VehicleLocationAtExit.ToCompactString(),
                      *ExitLocation.ToCompactString(),
                      *ResultingPawnLocation.ToCompactString(),
                      ExitErrorCm);
              }
              return true;'''.replace('              ', '    ')
          if old_gunner not in armed:
              raise SystemExit('gunner exit signature not found')
          armed = armed.replace(old_gunner, new_gunner, 1)
          armed_path.write_text(armed, encoding='utf-8')

      - name: Commit transform evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCVehicleBase.cpp OsterConflict/Source/OsterConflict/Private/OCArmedVehicleBase.cpp
          git diff --cached --check
          git commit -m "feat(pass45): add vehicle enter exit transform evidence"
          git push origin HEAD:fix/pass45-runtime-rejection-20260825
