name: Pass 45 M700 derived bolt translation UE58 pilot contract

# Local UE pilot contract. Kept for targeted debugging only; not an ordinary
# PR/push gate after batch-first PASS45 policy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed M700 UE58 pilot contract on demand
        run: |
          python -m py_compile PASS45_M700_DERIVED_BOLT_TRANSLATION_UE58_PILOT.py VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_UE58_PILOT.py
          python VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_UE58_PILOT.py
