name: Pass45 museum ownership cleanup patch

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-20260825
    paths:
      - .github/workflows/pass45-museum-ownership-cleanup-patch.yml

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass45-runtime-rejection-20260825
          fetch-depth: 0

      - name: Collapse Museum runtime ownership to primary authors
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, replacement, label, flags=0):
              out, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')
              return out

          # R13.7: visible exterior only. Remove temporary tree/gable/door/glass ownership.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCR137MuseumPhotoModelSubsystem.cpp')
          s = p.read_text(encoding='utf-8')
          s = sub1(s, r'\n    void AddGroundedTree\(.*?\n    \}\n(?=\})', '\n', 'R137 AddGroundedTree', re.S)
          s = sub1(s, r'    UStaticMesh\* Pine01 = LoadObject<UStaticMesh>\(nullptr,.*?SM_Tree_Var01\.SM_Tree_Var01"\)\);\n', '', 'R137 tree asset loads', re.S)
          s = sub1(s, r'    UInstancedStaticMeshComponent\* GableWood = MakeISM\(Model, Root, Cube, RedGableWood,\n        TEXT\("R137Museum_RedTimberGable"\), false, true\);\n', '', 'R137 gable component')
          s = sub1(s, r'    // Red/brown timber infill visible in the opposite gable:.*?\n    \}\n\n', '    // Pass45: R14.0 owns the reference-driven service gable; no temporary R13.7 gable.\n\n', 'R137 gable instances', re.S)
          s = sub1(s, r'        const float GlassOffset = bRear \? -4\.0f : 4\.0f;\n        AddBox\(Glass, Origin \+ FVector\(X, Y \+ GlassOffset, Z\), FVector\(Width, 8\.0f, Height\)\);\n', '        // Pass45: breakable actor owns visible glass; R13.7 owns trim/grilles only.\n', 'R137 front static glass')
          s = sub1(s, r'        const float GlassOffset = bLeft \? 4\.0f : -4\.0f;\n        AddBox\(Glass, Origin \+ FVector\(X \+ GlassOffset, Y, Z\), FVector\(8\.0f, Width, Height\)\);\n', '        // Pass45: breakable actor owns visible glass; R13.7 owns trim/grilles only.\n', 'R137 side static glass')
          s = sub1(s, r'    AddBox\(Doors, Museum \+ FVector\(-62\.0f, -672\.0f, 205\.0f\), FVector\(116\.0f, 16\.0f, 270\.0f\)\);\n    AddBox\(Doors, Museum \+ FVector\( 62\.0f, -672\.0f, 205\.0f\), FVector\(116\.0f, 16\.0f, 270\.0f\)\);\n', '    // Pass45: R13.9 owns the final replicated entrance door; no static prototype slabs.\n', 'R137 main door slabs')
          s = sub1(s, r'    // Separate grey side door and small decorative canopy visible on the gable-side photo\..*?\n\n    // Yellow exposed gas pipe', '    // Pass45: R14.0 owns the final service-door gable/canopy/door; no wrong prototype is authored here.\n\n    // Yellow exposed gas pipe', 'R137 wrong service prototype', re.S)
          s = sub1(s, r'    // Rebuild the site\'s mature conifers at realistic photo-relative spacing after hiding the oversized legacy pass\..*?        TreeCount\);\n', '    UE_LOG(LogTemp, Display,\n        TEXT("PASS45_MUSEUM_R137_PRIMARY_EXTERIOR_READY visible_shell_owner=R137 static_glass=0 prototype_doors=0 prototype_trees=0 prototype_service_gable=0"));\n    UE_LOG(LogTemp, Display,\n        TEXT("R13.7 museum model: reference exterior built once at MuseumAnchor; interaction glass/doors and final tree layout have separate current owners."));\n', 'R137 temporary tree block', re.S)
          p.write_text(s, encoding='utf-8')

          # R13.8: collision plus final breakable glass. Door ownership belongs directly to R13.9/R14.0.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCR138MuseumInteractiveArchitectureSubsystem.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('#include "OCBreakableWindow.h"\n', '#include "OCMuseumBreakableWindow.h"\n', 1)
          s = s.replace('#include "OCInteractableDoor.h"\n', '', 1)
          s = sub1(s, r'AOCBreakableWindow\* Window = World\.SpawnActor<AOCBreakableWindow>\(\n            AOCBreakableWindow::StaticClass\(\),', 'AOCMuseumBreakableWindow* Window = World.SpawnActor<AOCMuseumBreakableWindow>(\n            AOCMuseumBreakableWindow::StaticClass(),', 'R138 final window class')
          s = sub1(s, r'\n    void SpawnMuseumDoor\(.*?\n    \}\n', '\n', 'R138 door helper', re.S)
          s = sub1(s, r'    SpawnMuseumDoor\(World, Museum \+ FVector\(-108\.0f, -678\.0f, 70\.0f\).*?TEXT\("MuseumServiceDoor"\)\);\n\n', '    // Pass45: final doors are authored directly by R13.9/R14.0; no prototype door actors.\n\n', 'R138 door prototype calls', re.S)
          s = s.replace('PASS45_MUSEUM_INTERACTIVE_OPENINGS_READY duplicate_spawn=0 existing=1', 'PASS45_MUSEUM_INTERACTIVE_OPENINGS_READY duplicate_spawn=0 existing=1 final_window_class=1 prototype_doors=0')
          s = s.replace('PASS45_MUSEUM_INTERACTIVE_OPENINGS_READY duplicate_spawn=0 existing=0', 'PASS45_MUSEUM_INTERACTIVE_OPENINGS_READY duplicate_spawn=0 existing=0 final_window_class=1 prototype_doors=0')
          p.write_text(s, encoding='utf-8')

          # Final interactive window is glass/debris only. R13.7 owns visible frame/grille detail.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCMuseumBreakableWindow.cpp')
          s = p.read_text(encoding='utf-8')
          s = sub1(s, r'        if \(FrameMaterial\) Component->SetMaterial\(0, FrameMaterial\);\n        Component->SetCastShadow\(false\);', '        if (FrameMaterial) Component->SetMaterial(0, FrameMaterial);\n        Component->SetVisibility(false, true);\n        Component->SetHiddenInGame(true, true);\n        Component->SetCastShadow(false);', 'Museum window frame hide')
          s = s.replace('UE_LOG(LogTemp, Display, TEXT("PASS30_MUSEUM_WINDOW_FRAME_CLEAN_READY"));', 'UE_LOG(LogTemp, Display, TEXT("PASS45_MUSEUM_WINDOW_GLASS_ONLY_READY visible_frame_owner=R137 interactive_frame_visible=0 static_glass=0"));\n    UE_LOG(LogTemp, Display, TEXT("PASS30_MUSEUM_WINDOW_FRAME_CLEAN_READY visible_frame_owner=R137 overlap=0"));', 1)
          p.write_text(s, encoding='utf-8')

          # R14.0: additive/current owner only. No late R13.7 hiding or instance removal.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCR140MuseumFacadeDetailSubsystem.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('#include "OCBreakableWindow.h"\n', '#include "OCMuseumBreakableWindow.h"\n', 1)
          s = sub1(s, r'\n    void SuppressIncorrectR137GableAndCanopy\(.*?\n    \}\n\n(?=    void AddServiceGable)', '\n', 'R140 late suppression helper', re.S)
          s = sub1(s, r'AOCBreakableWindow\* Window = World\.SpawnActor<AOCBreakableWindow>\(\n            AOCBreakableWindow::StaticClass\(\),', 'AOCMuseumBreakableWindow* Window = World.SpawnActor<AOCMuseumBreakableWindow>(\n            AOCMuseumBreakableWindow::StaticClass(),', 'R140 final upper window')
          s = s.replace('        SuppressIncorrectR137GableAndCanopy(*MuseumOwner, Museum);\n\n', '', 1)
          s = s.replace('R14.0 museum facade: corrected service-door gable, upper window opening, carved/dentil trim, plaque, utilities and address detail built from REF-02/08/11/12/15/20.', 'PASS45_MUSEUM_R140_DETAIL_ONLY_READY late_r137_suppression=0 instance_removal=0; service gable/canopy/final door and upper glass authored directly from references.', 1)
          p.write_text(s, encoding='utf-8')

          # R14.5: sole current Museum tree owner; no late hiding of R13.7 trees.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCR145MuseumTreeLayoutSubsystem.cpp')
          s = p.read_text(encoding='utf-8')
          s = sub1(s, r'\n    void HideR137MuseumTrees\(.*?\n    \}\n', '\n', 'R145 late tree hide helper', re.S)
          s = s.replace('    HideR137MuseumTrees(World);\n\n', '', 1)
          s = s.replace('R14.5 museum trees: hidden symmetric R13.7 tree pass and placed %d asymmetrical photo-oriented mature trees; central approach remains open.', 'PASS45_MUSEUM_TREE_SINGLE_OWNER_READY owner=R145 r137_tree_pass=0 late_hide=0 placed=%d central_approach_open=1', 1)
          p.write_text(s, encoding='utf-8')

          # Coordinator: retire obsolete R14.1 Museum window replacement stage.
          p = Path('OsterConflict/Source/OsterConflict/Private/OCLandmarkStartupCoordinatorSubsystem.cpp')
          s = p.read_text(encoding='utf-8')
          s = s.replace('#include "OCR141MuseumWindowReplacementSubsystem.h"\n', '', 1)
          s = sub1(s, r'\n    if \(bHasGameplayAuthority\)\n    \{\n        if \(UOCR141MuseumWindowReplacementSubsystem\* Stage = World\.GetSubsystem<UOCR141MuseumWindowReplacementSubsystem>\(\)\)\n        \{.*?\n        \}\n    \}\n', '\n', 'coordinator R141 Museum stage', re.S)
          s = s.replace('museum_stages=R137_exterior+R138_interaction+R139_R145_details', 'museum_stages=R137_exterior+R138_collision_glass+R139_R140_doors_facade+R142_R145_details window_replacement_stage=0', 1)
          s = s.replace('authority-only door/window replacements preserved.', 'final door owners preserved; obsolete Museum window replacement stage retired.', 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit Museum ownership cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCR137MuseumPhotoModelSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCR138MuseumInteractiveArchitectureSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCMuseumBreakableWindow.cpp OsterConflict/Source/OsterConflict/Private/OCR140MuseumFacadeDetailSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCR145MuseumTreeLayoutSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCLandmarkStartupCoordinatorSubsystem.cpp
          git diff --cached --check
          git commit -m "refactor(pass45): collapse Museum runtime ownership"
          git push origin HEAD:fix/pass45-runtime-rejection-20260825
