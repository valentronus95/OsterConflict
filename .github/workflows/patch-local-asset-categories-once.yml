name: one-shot semantic local asset category patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-local-asset-categories-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Improve local asset classification and remove workflow
        shell: python
        run: |
          from pathlib import Path

          ps = Path('OsterConflict/Scripts/prepare_all_local_inbox_assets.ps1')
          text = ps.read_text(encoding='utf-8-sig')
          old = """    if ($v -match 'm16|m4a1|(^|[^a-z0-9])m4([^a-z0-9]|$)') { return 'M16_M4' }\n    if ($v -match 'ak.?47|rifle|weapon|gun|pistol|shotgun|smg|sniper|launcher|rocket') { return 'WEAPON_OTHER' }\n    if ($v -match 'pickup|pick.?up|technical|hilux|truck') { return 'PICKUP' }\n    if ($v -match 'skin|character|soldier|human|mannequin|uniform|operator|fighter|персона|солдат|скін|людин') { return 'CHARACTER_SKIN' }\n    if ($v -match 'building|house|home|museum|silpo|stadium|culture|college|street|town|village|будин|музей|стадіон|вулиц') { return 'BUILDING_WORLD' }\n    if ($v -match 'tree|foliage|grass|bush|vegetation|plant|дерев|кущ|трава') { return 'FOLIAGE' }\n    if ($v -match 'prop|furniture|chair|table|barrel|crate|fence|bridge|lamp|мебл|проп|паркан') { return 'PROP' }\n"""
          new = """    if ($v -match 'm16|m4a1|(^|[^a-z0-9])m4([^a-z0-9]|$)') { return 'M16_M4' }\n    if ($v -match 'ak.?47|(^|[^a-z0-9])akm([^a-z0-9]|$)') { return 'AK47' }\n    if ($v -match '(^|[^a-z0-9])mp5([^a-z0-9]|$)') { return 'MP5' }\n    if ($v -match 'm?1911') { return 'M1911' }\n    if ($v -match 'm700|remington.?700') { return 'M700' }\n    if ($v -match '(^|[^a-z0-9])m14([^a-z0-9]|$)') { return 'M14' }\n    if ($v -match 'mac.?10') { return 'MAC10' }\n    if ($v -match 'tec.?9') { return 'TEC9' }\n    if ($v -match 'lever|winchester') { return 'LEVER_ACTION' }\n    if ($v -match 'rpg|launcher|rocket') { return 'LAUNCHER' }\n    if ($v -match 'rifle|weapon|gun|pistol|shotgun|smg|sniper') { return 'WEAPON_OTHER' }\n    if ($v -match 'pickup|pick.?up|technical|hilux|truck') { return 'PICKUP' }\n    if ($v -match 'skin|character|soldier|human|mannequin|uniform|operator|fighter|персона|солдат|скін|людин') { return 'CHARACTER_SKIN' }\n    if ($v -match 'tree|foliage|grass|bush|vegetation|plant|flower|mushroom|treestump|дерев|кущ|трава') { return 'FOLIAGE' }\n    if ($v -match 'prop|furniture|chair|table|barrel|crate|fence|bridge|lamp|light|bench|ladder|plank|wheel|whell|bowl|cauldron|kettle|mug|spoon|bucket|pot|sack|cart|axe|boat|well|torch|hay|log|stone|мебл|проп|паркан') { return 'PROP' }\n    if ($v -match 'river|canal|stream|pond|waterway') { return 'WATER_WORLD' }\n    if ($v -match 'road|sidewalk|pavement|pathway') { return 'ROAD_WORLD' }\n    if ($v -match 'terrain|ground|landscape|mud|moss|field') { return 'GROUND_WORLD' }\n    if ($v -match 'building|house|home|hut|roof|wall|porch|balcony|shed|hovel|tower|museum|silpo|stadium|culture|college|street|town|village|будин|музей|стадіон|вулиц') { return 'BUILDING_WORLD' }\n"""
          if old not in text:
              raise SystemExit('PowerShell category block not found')
          ps.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\r\n')

          py = Path('OsterConflict/Scripts/import_all_local_inbox_assets.py')
          text = py.read_text(encoding='utf-8-sig')
          old = """    if re.search(r\"m16|m4a1|(^|[^a-z0-9])m4([^a-z0-9]|$)\", v): return \"M16_M4\"\n    if re.search(r\"ak.?47|rifle|weapon|gun|pistol|shotgun|smg|sniper|launcher|rocket\", v): return \"WEAPON_OTHER\"\n    if re.search(r\"pickup|pick.?up|technical|hilux|truck\", v): return \"PICKUP\"\n    if re.search(r\"skin|character|soldier|human|mannequin|uniform|operator|fighter|персона|солдат|скін|людин\", v): return \"CHARACTER_SKIN\"\n    if re.search(r\"building|house|home|museum|silpo|stadium|culture|college|street|town|village|будин|музей|стадіон|вулиц\", v): return \"BUILDING_WORLD\"\n    if re.search(r\"tree|foliage|grass|bush|vegetation|plant|дерев|кущ|трава\", v): return \"FOLIAGE\"\n    if re.search(r\"prop|furniture|chair|table|barrel|crate|fence|bridge|lamp|мебл|проп|паркан\", v): return \"PROP\"\n"""
          new = """    if re.search(r\"m16|m4a1|(^|[^a-z0-9])m4([^a-z0-9]|$)\", v): return \"M16_M4\"\n    if re.search(r\"ak.?47|(^|[^a-z0-9])akm([^a-z0-9]|$)\", v): return \"AK47\"\n    if re.search(r\"(^|[^a-z0-9])mp5([^a-z0-9]|$)\", v): return \"MP5\"\n    if re.search(r\"m?1911\", v): return \"M1911\"\n    if re.search(r\"m700|remington.?700\", v): return \"M700\"\n    if re.search(r\"(^|[^a-z0-9])m14([^a-z0-9]|$)\", v): return \"M14\"\n    if re.search(r\"mac.?10\", v): return \"MAC10\"\n    if re.search(r\"tec.?9\", v): return \"TEC9\"\n    if re.search(r\"lever|winchester\", v): return \"LEVER_ACTION\"\n    if re.search(r\"rpg|launcher|rocket\", v): return \"LAUNCHER\"\n    if re.search(r\"rifle|weapon|gun|pistol|shotgun|smg|sniper\", v): return \"WEAPON_OTHER\"\n    if re.search(r\"pickup|pick.?up|technical|hilux|truck\", v): return \"PICKUP\"\n    if re.search(r\"skin|character|soldier|human|mannequin|uniform|operator|fighter|персона|солдат|скін|людин\", v): return \"CHARACTER_SKIN\"\n    if re.search(r\"tree|foliage|grass|bush|vegetation|plant|flower|mushroom|treestump|дерев|кущ|трава\", v): return \"FOLIAGE\"\n    if re.search(r\"prop|furniture|chair|table|barrel|crate|fence|bridge|lamp|light|bench|ladder|plank|wheel|whell|bowl|cauldron|kettle|mug|spoon|bucket|pot|sack|cart|axe|boat|well|torch|hay|log|stone|мебл|проп|паркан\", v): return \"PROP\"\n    if re.search(r\"river|canal|stream|pond|waterway\", v): return \"WATER_WORLD\"\n    if re.search(r\"road|sidewalk|pavement|pathway\", v): return \"ROAD_WORLD\"\n    if re.search(r\"terrain|ground|landscape|mud|moss|field\", v): return \"GROUND_WORLD\"\n    if re.search(r\"building|house|home|hut|roof|wall|porch|balcony|shed|hovel|tower|museum|silpo|stadium|culture|college|street|town|village|будин|музей|стадіон|вулиц\", v): return \"BUILDING_WORLD\"\n"""
          if old not in text:
              raise SystemExit('Python category block not found')
          py.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          Path('.github/workflows/patch-local-asset-categories-once.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Scripts/prepare_all_local_inbox_assets.ps1 OsterConflict/Scripts/import_all_local_inbox_assets.py .github/workflows/patch-local-asset-categories-once.yml
          git commit -m "Pass45: classify every local asset family semantically"
          git push origin main
