name: Main runtime acceptance launcher contracts

on:
  push:
    branches:
      - main
      - 'fix/runtime-acceptance-*'
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'VERIFY_MAIN_RUNTIME_ACCEPTANCE_LAUNCHER.py'
      - 'VERIFY_PASS45_RUNTIME_EVIDENCE_LOG.py'
      - 'VERIFY_RUNTIME_RECONCILE_PASS_8.py'
      - '.github/workflows/main-runtime-acceptance-launcher.yml'
  pull_request:
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'VERIFY_MAIN_RUNTIME_ACCEPTANCE_LAUNCHER.py'
      - 'VERIFY_PASS45_RUNTIME_EVIDENCE_LOG.py'
      - 'VERIFY_RUNTIME_RECONCILE_PASS_8.py'
      - '.github/workflows/main-runtime-acceptance-launcher.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify single runtime acceptance launcher
        run: python VERIFY_MAIN_RUNTIME_ACCEPTANCE_LAUNCHER.py
