name: Apply frontend single-owner Pass 28

on:
  push:
    branches:
      - fix/frontend-single-owner-pass-28-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Pass 28 single-owner frontend fix') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-single-owner-pass-28-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Pass 28
        run: python APPLY_FRONTEND_SINGLE_OWNER_PASS_28.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCGameUIRootWidget.cpp OSTER_CONFLICT_WORK_LEDGER.md
          git commit -m "Apply Pass 28 single-owner frontend fix"
          git push origin HEAD:fix/frontend-single-owner-pass-28-20260823
