name: Source verification

on:
  push:
    branches:
      - r13-content-gameplay-pass
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply final S01 park north path migration
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: python .\MIGRATE_R13_S01_PARK_NORTH_PATH_RUNTIME.py

      - name: Verify migrated S01 park north path
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: python .\VERIFY_R13_LOCATION_FIRST_S01_PARK_NORTH_PATH.py

      - name: Commit migrated world source
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: |
          git diff --quiet -- OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp
          if ($LASTEXITCODE -eq 0) {
            Write-Host "World source already migrated"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp
          git commit -m "Own S01 park north path explicitly"
          git push origin HEAD:r13-content-gameplay-pass

      - name: Run structural and regression verifiers
        shell: pwsh
        run: python .\RUN_ALL_VERIFY.py
