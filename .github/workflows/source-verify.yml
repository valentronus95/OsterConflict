name: Source verification

on:
  push:
    branches:
      - r13-content-gameplay-pass
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run structural and regression verifiers
        shell: pwsh
        run: |
          python .\RUN_ALL_VERIFY.py 2>&1 | Tee-Object -FilePath .\source_verify.log
          $VerifyExit = $LASTEXITCODE
          if ($VerifyExit -ne 0) { exit $VerifyExit }

      - name: Upload verifier diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-verify-log-${{ github.run_number }}
          path: source_verify.log
          if-no-files-found: warn
          retention-days: 7
