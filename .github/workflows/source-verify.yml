name: Source verification

on:
  push:
    branches:
      - r13-content-gameplay-pass
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Close out S01 road verifier
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: python .\MIGRATE_R13_S01_ROAD_VERIFIER_CLOSEOUT.py

      - name: Verify S01 road and path ownership
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: |
          python .\VERIFY_R13_LOCATION_FIRST_S01_ROAD_TOPOLOGY.py
          python .\VERIFY_R13_LOCATION_FIRST_S01_PARK_NORTH_PATH.py

      - name: Commit S01 verifier closeout
        if: github.event_name == 'push' && github.ref == 'refs/heads/r13-content-gameplay-pass'
        shell: pwsh
        run: |
          git diff --quiet -- VERIFY_R13_LOCATION_FIRST_S01_ROAD_TOPOLOGY.py
          if ($LASTEXITCODE -eq 0) {
            Write-Host "S01 road verifier already closed out"
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFY_R13_LOCATION_FIRST_S01_ROAD_TOPOLOGY.py
          git commit -m "Close out S01 road and path ownership verification"
          git push origin HEAD:r13-content-gameplay-pass

      - name: Run structural and regression verifiers
        shell: pwsh
        run: python .\RUN_ALL_VERIFY.py
