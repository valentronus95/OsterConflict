name: Apply frontend static-start Pass 29

on:
  push:
    branches:
      - fix/frontend-static-start-pass-29-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Pass 29 static frontend fix') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-static-start-pass-29-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply Pass 29
        run: python APPLY_FRONTEND_STATIC_START_PASS_29.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCGameUIRootWidget.cpp RUN_R14_CURRENT_GAMEPLAY.cmd OSTER_CONFLICT_WORK_LEDGER.md
          git commit -m "Apply Pass 29 static frontend fix"
          git push origin HEAD:fix/frontend-static-start-pass-29-20260823
