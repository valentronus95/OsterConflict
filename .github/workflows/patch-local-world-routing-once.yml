name: one-shot local world routing patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-local-world-routing-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch semantic world routing and weapon visibility
        shell: python
        run: |
          from pathlib import Path

          p = Path('OsterConflict/Source/OsterConflict/Private/OCLocalInboxWeaponOverrideSubsystem.cpp')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace('Component->SetVisibility(false, true);\n                Component->SetHiddenInGame(true, true);',
                              'Component->SetVisibility(false, false);\n                Component->SetHiddenInGame(true, false);')
          p.write_text(text, encoding='utf-8', newline='\n')

          p = Path('OsterConflict/Source/OsterConflict/Private/OCLocalInboxWorldAssetsSubsystem.cpp')
          text = p.read_text(encoding='utf-8-sig')
          old = '''                !Category.Equals(TEXT("FOLIAGE"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("PROP"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("UNCLASSIFIED"), ESearchCase::IgnoreCase))'''
          new = '''                !Category.Equals(TEXT("FOLIAGE"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("PROP"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("ROAD_WORLD"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("WATER_WORLD"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("GROUND_WORLD"), ESearchCase::IgnoreCase) &&\n                !Category.Equals(TEXT("UNCLASSIFIED"), ESearchCase::IgnoreCase))'''
          if old not in text:
              raise SystemExit('world category filter marker missing')
          text = text.replace(old, new, 1)

          old = '''    TArray<FLocalWorldAsset> Fences;\n    TArray<FLocalWorldAsset> Props;\n\n    const TArray<FString> GroundWords = { TEXT("grass"), TEXT("flower"), TEXT("fern"), TEXT("heather"), TEXT("yarrow"), TEXT("leaf"), TEXT("moss") };\n    const TArray<FString> FenceWords = { TEXT("fence"), TEXT("wall"), TEXT("gate"), TEXT("barrier"), TEXT("паркан") };'''
          new = '''    TArray<FLocalWorldAsset> Fences;\n    TArray<FLocalWorldAsset> Bridges;\n    TArray<FLocalWorldAsset> Roads;\n    TArray<FLocalWorldAsset> Water;\n    TArray<FLocalWorldAsset> Props;\n\n    const TArray<FString> GroundWords = { TEXT("grass"), TEXT("flower"), TEXT("fern"), TEXT("heather"), TEXT("yarrow"), TEXT("leaf"), TEXT("moss") };\n    const TArray<FString> FenceWords = { TEXT("fence"), TEXT("wall"), TEXT("gate"), TEXT("barrier"), TEXT("паркан") };\n    const TArray<FString> BridgeWords = { TEXT("bridge"), TEXT("міст") };'''
          if old not in text:
              raise SystemExit('world pool declaration marker missing')
          text = text.replace(old, new, 1)

          old = '''        else if (Asset.Category.Equals(TEXT("PROP"), ESearchCase::IgnoreCase))\n        {\n            if (ContainsAny(Hint, FenceWords)) Fences.Add(Asset);\n            else Props.Add(Asset);\n        }\n        else Props.Add(Asset);'''
          new = '''        else if (Asset.Category.Equals(TEXT("PROP"), ESearchCase::IgnoreCase))\n        {\n            if (ContainsAny(Hint, FenceWords)) Fences.Add(Asset);\n            else if (ContainsAny(Hint, BridgeWords)) Bridges.Add(Asset);\n            else Props.Add(Asset);\n        }\n        else if (Asset.Category.Equals(TEXT("ROAD_WORLD"), ESearchCase::IgnoreCase)) Roads.Add(Asset);\n        else if (Asset.Category.Equals(TEXT("WATER_WORLD"), ESearchCase::IgnoreCase)) Water.Add(Asset);\n        else if (Asset.Category.Equals(TEXT("GROUND_WORLD"), ESearchCase::IgnoreCase)) GroundFoliage.Add(Asset);\n        else Props.Add(Asset);'''
          if old not in text:
              raise SystemExit('world category routing marker missing')
          text = text.replace(old, new, 1)

          old = '''        TotalReplaced += BindMeshPool(Sector, Props,\n            { TEXT("ResidentialDetails"), TEXT("LandmarkDetails"), TEXT("StadiumDetails"), TEXT("ParkDetails") },\n            TEXT("Props"), Loaded, Used);\n        TotalLoadedAssets += Loaded; TotalUsedAssets += Used;'''
          new = '''        TotalReplaced += BindMeshPool(Sector, Bridges,\n            { TEXT("Bridges") }, TEXT("Bridges"), Loaded, Used);\n        TotalLoadedAssets += Loaded; TotalUsedAssets += Used;\n\n        TotalReplaced += BindMeshPool(Sector, Roads,\n            { TEXT("Roads"), TEXT("Sidewalks") }, TEXT("Roads"), Loaded, Used);\n        TotalLoadedAssets += Loaded; TotalUsedAssets += Used;\n\n        TotalReplaced += BindMeshPool(Sector, Water,\n            { TEXT("Waterways") }, TEXT("Water"), Loaded, Used);\n        TotalLoadedAssets += Loaded; TotalUsedAssets += Used;\n\n        TotalReplaced += BindMeshPool(Sector, Props,\n            { TEXT("ResidentialDetails"), TEXT("LandmarkDetails"), TEXT("StadiumDetails"), TEXT("ParkDetails") },\n            TEXT("Props"), Loaded, Used);\n        TotalLoadedAssets += Loaded; TotalUsedAssets += Used;'''
          if old not in text:
              raise SystemExit('world bind marker missing')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          Path('.github/workflows/patch-local-world-routing-once.yml').unlink()
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCLocalInboxWeaponOverrideSubsystem.cpp OsterConflict/Source/OsterConflict/Private/OCLocalInboxWorldAssetsSubsystem.cpp .github/workflows/patch-local-world-routing-once.yml
          git commit -m "Pass45: route every local world asset family into live Oster"
          git push origin main
