name: Normal game route Pass 20

on:
  pull_request:
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - 'VERIFY_CONTENT_READINESS_PASS_19.py'
      - 'VERIFY_RUNTIME_RECOVERY_PASS_15.py'
      - '.github/workflows/normal-game-route-pass-20.yml'
  push:
    branches:
      - main
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - 'VERIFY_CONTENT_READINESS_PASS_19.py'
      - 'VERIFY_RUNTIME_RECOVERY_PASS_15.py'
      - '.github/workflows/normal-game-route-pass-20.yml'

jobs:
  verify-pass-20:
    runs-on: windows-latest
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 19 compatibility
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_CONTENT_READINESS_PASS_19.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Pass 15 compatibility
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_RECOVERY_PASS_15.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify normal game route Pass 20
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_NORMAL_GAME_ROUTE_PASS_20.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
