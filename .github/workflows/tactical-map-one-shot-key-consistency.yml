name: One-shot Tactical Map key consistency patch

on:
  push:
    branches:
      - feat/tactical-map-v2
    paths:
      - '.github/workflows/tactical-map-one-shot-key-consistency.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/tactical-map-v2
          fetch-depth: 0

      - name: Apply exact M-to-V trap consistency patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          edits = [
              (
                  Path('OsterConflict/Source/OsterConflict/Private/OCCharacter.cpp'),
                  'DefaultMappingContext->MapKey(DeployTrapAction, EKeys::M);',
                  'DefaultMappingContext->MapKey(DeployTrapAction, EKeys::V);'
              ),
              (
                  Path('OsterConflict/Source/OsterConflict/Private/OCHUD.cpp'),
                  'TEXT("N %s   M DEPLOY x%d")',
                  'TEXT("N %s   V DEPLOY x%d")'
              ),
          ]

          for path, old, new in edits:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          character = edits[0][0].read_text(encoding='utf-8')
          hud = edits[1][0].read_text(encoding='utf-8')
          if 'MapKey(DeployTrapAction, EKeys::M)' in character:
              raise SystemExit('DeployTrap default mapping still contains M')
          if 'M DEPLOY' in hud:
              raise SystemExit('HUD still advertises M DEPLOY')
          if 'MapKey(DeployTrapAction, EKeys::V)' not in character or 'V DEPLOY' not in hud:
              raise SystemExit('V DeployTrap consistency markers are incomplete')
          print('M/V Tactical Map key consistency patch applied.')
          '@ | Set-Content -Encoding utf8 .\_apply_key_consistency.py
          python .\_apply_key_consistency.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .\_apply_key_consistency.py -Force

      - name: Verify Tactical Map contracts and diff
        shell: pwsh
        run: |
          python .\VERIFY_TACTICAL_MAP_V2.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_TACTICAL_MAP_INPUT_SAFETY.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- OsterConflict/Source/OsterConflict/Private/OCCharacter.cpp OsterConflict/Source/OsterConflict/Private/OCHUD.cpp

      - name: Commit exact source patch to feature branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCCharacter.cpp OsterConflict/Source/OsterConflict/Private/OCHUD.cpp
          if (git diff --cached --quiet) { throw 'Key consistency patch produced no staged source change.' }
          git commit -m "Make V the canonical trap key beside Tactical Map M"
          git push origin HEAD:feat/tactical-map-v2
