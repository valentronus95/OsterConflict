name: R14 character model contracts

on:
  pull_request:
    paths:
      - '.github/workflows/r14-character-model-contracts.yml'
      - 'OsterConflict/Source/OsterConflict/Public/OCCharacterProductionProfiles.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCCharacterProductionProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/Tests/OCCharacterProductionProfileTests.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionCharacterAssetsSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCCharacterVisualTypes.h'
      - 'R14_MODEL_REGISTRY.md'
      - 'R14_MODEL_INTEGRATION_HISTORY.md'
  push:
    branches:
      - feat/r14-production-models
    paths:
      - '.github/workflows/r14-character-model-contracts.yml'
      - 'OsterConflict/Source/OsterConflict/Public/OCCharacterProductionProfiles.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCCharacterProductionProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/Tests/OCCharacterProductionProfileTests.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionCharacterAssetsSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCCharacterVisualTypes.h'
      - 'R14_MODEL_REGISTRY.md'
      - 'R14_MODEL_INTEGRATION_HISTORY.md'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate R14 character model contracts
        shell: python
        run: |
          from pathlib import Path
          import sys

          failures = []

          def require(condition, message):
              if not condition:
                  failures.append(message)

          header = Path('OsterConflict/Source/OsterConflict/Public/OCCharacterProductionProfiles.h').read_text(encoding='utf-8')
          profiles = Path('OsterConflict/Source/OsterConflict/Private/OCCharacterProductionProfiles.cpp').read_text(encoding='utf-8')
          tests = Path('OsterConflict/Source/OsterConflict/Private/Tests/OCCharacterProductionProfileTests.cpp').read_text(encoding='utf-8')
          runtime = Path('OsterConflict/Source/OsterConflict/Private/OCProductionCharacterAssetsSubsystem.cpp').read_text(encoding='utf-8')
          visual_types = Path('OsterConflict/Source/OsterConflict/Public/OCCharacterVisualTypes.h').read_text(encoding='utf-8')

          require('FOCCharacterProductionProfile' in header, 'character production profile schema missing')
          require('bFactionUniqueBody = false' in header, 'character body uniqueness must default false')
          require('bFactionUniqueArms = false' in header, 'character arms uniqueness must default false')
          require('OCGetDeclaredCharacterProductionModules' in header, 'character module registry API missing')

          factions = ('UASpecialUnit', 'MaskedFighters', 'USRangers', 'Insurgents')
          for faction in factions:
              require(faction in visual_types, f'visual faction enum missing {faction}')
              require(faction in profiles, f'production profile missing faction {faction}')
              require(faction in tests, f'character automation missing faction {faction}')

          body_path = '/Game/QuantumCharacter/Mesh/SKM_QuantumCharacter.SKM_QuantumCharacter'
          arms_path = '/Game/QuantumCharacter/Mesh/Modules/SKM_Arms.SKM_Arms'
          require(body_path in profiles, 'verified QuantumCharacter body path changed')
          require(arms_path in profiles, 'verified QuantumCharacter arms path changed')
          require(body_path in runtime, 'runtime subsystem no longer uses verified QuantumCharacter body')
          require(arms_path in runtime, 'runtime subsystem no longer uses verified QuantumCharacter arms')

          module_paths = (
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Head.SKM_Head',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Bulletproof_Bege.SKM_Bulletproof_Bege',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Drops_1_Bege.SKM_Drops_1_Bege',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Holster_Hard_Bege.SKM_Holster_Hard_Bege',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Jeans.SKM_Jeans',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Patch_Back.SKM_Patch_Back',
              '/Game/QuantumCharacter/Mesh/Modules/SKM_Shirt_RolledUp_Blue.SKM_Shirt_RolledUp_Blue',
              '/Game/QuantumCharacter/Mesh/Modules/SM_Cap_Bege.SM_Cap_Bege',
          )
          for path in module_paths:
              require(path in profiles, f'audited QuantumCharacter module missing from registry: {path}')

          require('Profile.bFactionUniqueBody = false' in profiles,
                  'shared body is being falsely marked faction-unique')
          require('Profile.bFactionUniqueArms = false' in profiles,
                  'shared arms are being falsely marked faction-unique')
          require('Modules.Num() >= 9' in tests, 'character module automation coverage was weakened')
          require('GetSkeleton()' in tests, 'character automation no longer validates skeletal modules')
          require('GetLODNum() > 0' in tests, 'character automation no longer validates skeletal LODs')
          require('GetNumLODs() > 0' in tests, 'character automation no longer validates static LODs')

          if failures:
              print('R14 character model contract validation FAILED:')
              for failure in failures:
                  print(f' - {failure}')
              sys.exit(1)

          print('R14 character model contract validation PASS')
