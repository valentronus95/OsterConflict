name: Pass 45 item16 production profile cutover

on:
  pull_request:
    paths:
      - 'VERIFY_PASS45_ITEM16_PRODUCTION_PROFILE_CUTOVER.py'
      - 'VERIFY_PASS45_RUNTIME_EVIDENCE_LOG.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - '_DOCS/PASS45_ITEM16_MANUAL_ACTION_CALIBRATION_APPROVAL.json'
      - '_DOCS/PASS45_ITEM16_PRODUCTION_AUTHORING_RECEIPT.json'
      - 'OsterConflict/Content/Production/Weapons/M700/**'
      - 'OsterConflict/Content/Production/Weapons/LeverAction/**'
      - '.github/workflows/pass45-item16-production-profile-cutover.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile production profile cutover guard
        run: python -m py_compile VERIFY_PASS45_ITEM16_PRODUCTION_PROFILE_CUTOVER.py
      - name: Verify staged item16 production profile cutover
        run: python VERIFY_PASS45_ITEM16_PRODUCTION_PROFILE_CUTOVER.py
