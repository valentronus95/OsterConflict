name: Runtime map spawn FPS assets Pass 44

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/runtime-map-spawn-fps-assets-pass-44-*'
  workflow_dispatch:

jobs:
  verify-pass-44:
    runs-on: windows-latest
    steps:
      - name: Checkout source without large LFS hydration
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current Pass 44 contracts and stale-rule retirement
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_MAP_SPAWN_FPS_ASSETS_PASS_44.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_WEAPON_MATERIAL_LOWCPU_PERF_PASS_36.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_VISIBLE_MUSEUM_WEAPON_PALETTE_PASS_37.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_RUNTIME_RUNAWAY_HEAT_PASS_38.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_PRODUCTION_VEHICLE_GROUND_RACK_PASS_42.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_SLATE_RENDER_TARGET_STARTUP_PASS_43.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
