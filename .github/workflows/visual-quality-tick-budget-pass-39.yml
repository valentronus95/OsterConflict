name: Visual quality and tick budget Pass 39

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/visual-quality-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-quality-tick-budget-pass-39-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-39:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 39 visual quality and tick budget
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_GRAPHICS_PASS_16.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_RUNTIME_RECOVERY_PASS_15.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_VISUAL_QUALITY_TICK_BUDGET_PASS_39.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
