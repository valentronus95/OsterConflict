    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fail-closed UE58 assembly audit on demand
        run: |
          python -m py_compile PASS45_REMINGTON870_DERIVED_PUMP_UE58_ASSEMBLY_AUDIT.py VERIFY_PASS45_REMINGTON870_DERIVED_PUMP_UE58_ASSEMBLY_AUDIT.py
          python VERIFY_PASS45_REMINGTON870_DERIVED_PUMP_UE58_ASSEMBLY_AUDIT.py
