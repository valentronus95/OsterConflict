name: Apply frontend WidgetTree Pass 27

on:
  push:
    branches:
      - fix/frontend-widgettree-pass-27-20260823
    paths:
      - 'APPLY_FRONTEND_WIDGETTREE_PASS_27.py'
      - '.github/workflows/apply-frontend-widgettree-pass-27.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-widgettree-pass-27-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Pass 27
        run: python APPLY_FRONTEND_WIDGETTREE_PASS_27.py
      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp RUN_R14_CURRENT_GAMEPLAY.cmd OSTER_CONFLICT_WORK_LEDGER.md
          git commit -m "Pass 27: move frontend widgets into WidgetTree"
          git push origin HEAD:fix/frontend-widgettree-pass-27-20260823