name: Playflow and performance pass 14

on:
  pull_request:
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCR13FrontendMenuSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCDenseGroundFoliageSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualEnvironment.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCPerformanceSampleSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCPerformanceSampleSubsystem.h'
      - 'OsterConflict/IMPORT_PRODUCTION_VEHICLES_UE58.cmd'
      - 'VERIFY_RUNTIME_RECONCILE_PASS_8.py'
      - 'VERIFY_PLAYFLOW_PERFORMANCE_PASS_14.py'
      - 'VERIFY_PASS45_RUNTIME_EVIDENCE_LOG.py'
      - '.github/workflows/playflow-performance-pass-14.yml'
  push:
    branches: [ main ]
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCDenseGroundFoliageSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualEnvironment.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCPerformanceSampleSubsystem.cpp'
      - 'OsterConflict/IMPORT_PRODUCTION_VEHICLES_UE58.cmd'
      - 'VERIFY_PLAYFLOW_PERFORMANCE_PASS_14.py'
      - 'VERIFY_PASS45_RUNTIME_EVIDENCE_LOG.py'
      - '.github/workflows/playflow-performance-pass-14.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify playflow and performance contracts
        run: python VERIFY_PLAYFLOW_PERFORMANCE_PASS_14.py
      - name: Re-run Pass 7 frontend/deployment contracts
        run: python VERIFY_RUNTIME_ACCEPTANCE_PASS_7.py
      - name: Re-run Pass 8 reconciled runtime contracts
        run: python VERIFY_RUNTIME_RECONCILE_PASS_8.py
