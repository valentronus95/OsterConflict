name: Pass 24 one-shot frontend patch

on:
  push:
    branches:
      - fix/frontend-slate-transition-pass-24-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pass24-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact frontend patch
        run: python tools/pass24_patch_frontend.py
      - name: Verify patch diff
        run: |
          git diff --check
          git diff -- OsterConflict/Source/OsterConflict/Public/OCR13FrontendMenuSubsystem.h OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp
      - name: Commit patched frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Public/OCR13FrontendMenuSubsystem.h OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp
          if git diff --cached --quiet; then
            echo "Patch produced no changes" >&2
            exit 1
          fi
          git commit -m "fix: defer frontend Slate transitions [pass24-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
