name: Runtime recovery Pass 45

on:
  push:
    branches:
      - fix/runtime-recovery-pass-45-20260824
      - main
  pull_request:
    paths:
      - 'PASS45_RUNTIME_RECOVERY_TZ.md'
      - 'RUNTIME_EVIDENCE/2026-08-24_PASS44_REJECTED/**'
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'VERIFY_RUNTIME_RECOVERY_PASS_45.py'
      - 'VERIFY_SLATE_RENDER_TARGET_STARTUP_PASS_43.py'
      - 'VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py'
      - 'RUN_ALL_VERIFY.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCPerformanceSampleSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCPerformanceSampleSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCR146LandmarkSeparationSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldRenderBudgetPass17Subsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCFoliageRuntimeGuardSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCFoliageRuntimeGuardSubsystem.h'

jobs:
  pass45-source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pass 45 recovery contract
        run: python VERIFY_RUNTIME_RECOVERY_PASS_45.py
      - name: Verify renderer startup contract
        run: python VERIFY_SLATE_RENDER_TARGET_STARTUP_PASS_43.py
      - name: Verify DX11 SM5 contract
        run: python VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py
