name: R14 weapon model contracts

on:
  pull_request:
    paths:
      - '.github/workflows/r14-weapon-model-contracts.yml'
      - 'R14_PRODUCTION_MODELS_TZ.md'
      - 'R14_MODEL_REGISTRY.md'
      - 'OsterConflict/VALIDATE_PRODUCTION_MODELS_UE58.cmd'
      - 'OsterConflict/PASS45_REIMPORT_STEIN_WEAPON_MATERIALS_UE58.cmd'
      - 'OsterConflict/TRY_PASS45_STEIN_WEAPON_MATERIALS_UE58.cmd'
      - 'OsterConflict/Scripts/pass45_reimport_stein_weapon_materials.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponVariants.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCAntiArmorLauncher.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCAntiArmorLauncher.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionWeaponRuntimeValidationSubsystem.cpp'
      - 'VERIFY_PASS45_WEAPON_MATERIAL_DEPENDENCY_AUDIT.py'
  push:
    branches:
      - main
      - 'fix/pass45-runtime-rejection-*'
    paths:
      - '.github/workflows/r14-weapon-model-contracts.yml'
      - 'R14_PRODUCTION_MODELS_TZ.md'
      - 'R14_MODEL_REGISTRY.md'
      - 'OsterConflict/VALIDATE_PRODUCTION_MODELS_UE58.cmd'
      - 'OsterConflict/PASS45_REIMPORT_STEIN_WEAPON_MATERIALS_UE58.cmd'
      - 'OsterConflict/TRY_PASS45_STEIN_WEAPON_MATERIALS_UE58.cmd'
      - 'OsterConflict/Scripts/pass45_reimport_stein_weapon_materials.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponVariants.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCAntiArmorLauncher.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCAntiArmorLauncher.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionWeaponRuntimeValidationSubsystem.cpp'
      - 'VERIFY_PASS45_WEAPON_MATERIAL_DEPENDENCY_AUDIT.py'

permissions:
  contents: read

jobs:
  weapon-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Validate current R14/Pass45 weapon integration contract
        shell: python
        run: |
          from pathlib import Path
          import sys

          root = Path('.')
          variants = (root / 'OsterConflict/Source/OsterConflict/Private/OCWeaponVariants.cpp').read_text(encoding='utf-8')
          launcher = (root / 'OsterConflict/Source/OsterConflict/Private/OCAntiArmorLauncher.cpp').read_text(encoding='utf-8')
          launcher_h = (root / 'OsterConflict/Source/OsterConflict/Public/OCAntiArmorLauncher.h').read_text(encoding='utf-8')
          runtime = (root / 'OsterConflict/Source/OsterConflict/Private/OCProductionWeaponRuntimeValidationSubsystem.cpp').read_text(encoding='utf-8')
          validator = (root / 'OsterConflict/VALIDATE_PRODUCTION_MODELS_UE58.cmd').read_text(encoding='utf-8')
          registry = (root / 'R14_MODEL_REGISTRY.md').read_text(encoding='utf-8')
          tz = (root / 'R14_PRODUCTION_MODELS_TZ.md').read_text(encoding='utf-8')

          failures = []
          def require(condition, message):
              if not condition:
                  failures.append(message)

          required_paths = (
              '/Game/AK-47/Mesh/SKM_AK-47.SKM_AK-47',
              '/Game/R13/Weapons/Stein/MP5/SKM_MP5.SKM_MP5',
              '/Game/R13/Weapons/Stein/1911/SKM_1911.SKM_1911',
              '/Game/R13/Weapons/Stein/M700/SKM_M700.SKM_M700',
              '/Game/Production/Weapons/Remington870/SKM_Remington870.SKM_Remington870',
              '/Game/Production/Weapons/M249/SM_M249.SM_M249',
              '/Game/R13/Weapons/Stein/M14/SKM_M14.SKM_M14',
              '/Game/R13/Weapons/Stein/Mac10/SKM_Mac10.SKM_Mac10',
              '/Game/R13/Weapons/Stein/Tec9/SKM_Tec9.SKM_Tec9',
              '/Game/R13/Weapons/Stein/LeverAction/SKM_LeverAction.SKM_LeverAction',
          )
          for path in required_paths:
              require(path in variants, f'weapon runtime path missing or changed: {path}')

          require('OC_ProductionWeaponVisual' in variants, 'production weapon visual tag missing')
          require('HideStaticWeaponFallback' in variants, 'production visual no longer hides source fallback')
          require('OC_RPG1' in launcher and 'EOCWeaponClass::Launcher' in launcher, 'anti-armor launcher contract changed')
          require('/Game/R13/Weapons/rocketlauncherModern.rocketlauncherModern' in launcher, 'anti-armor launcher mesh path missing')
          require('void AOCAntiArmorLauncher::BeginPlay()' in launcher and 'virtual void BeginPlay() override;' in launcher_h,
                  'anti-armor launcher production visual hook incomplete')

          for marker in ('ValidateProductionWeapons', 'ValidateProductionWeaponsHeadless', 'weapon_runtime_validation.txt',
                         'production_weapon_runtime_success.txt', 'GetUsedTextures(', '_defaultMat'):
              require(marker in runtime, f'current runtime weapon truth contract missing: {marker}')

          require('-ValidateProductionWeapons' in validator and '-ValidateProductionWeaponsHeadless' in validator,
                  'one-click validator lost explicit runtime material inspection')
          require('weapon_runtime_validation.txt' in validator, 'one-click validator lost runtime dependency report')
          require('PASS45_REIMPORT_STEIN_WEAPON_MATERIALS_UE58.cmd' in validator,
                  'one-click validator does not prepare current Stein authored materials')
          require('PR #15' not in validator, 'obsolete model-integration PR #15 reference returned')

          require('/Game/R13/Weapons/rocketlauncherModern' in registry and 'CC0' in registry,
                  'R14 registry lost launcher path/license truth')
          require('first-person' in tz.lower() and 'third-person' in tz.lower(),
                  'R14 TZ lost first-/third-person weapon validation requirements')
          require('fire animation' in tz.lower() and 'reload animation' in tz.lower(),
                  'R14 TZ lost fire/reload validation requirements')

          if failures:
              print('R14/Pass45 weapon model contract validation FAILED:')
              for failure in failures:
                  print(' -', failure)
              sys.exit(1)

          print('R14/PASS45 WEAPON MODEL CONTRACT: PASS')
          print('- obsolete PR #15 readiness prose is forbidden, not required')
          print('- exact runtime paths remain declared; missing exact payload remains a separate content-gap state')
          print('- Pass45 authored material/dependency inspection remains explicit and opt-in')
          print('STATUS: SOURCE CONTRACT ONLY; local UE 5.8 rendered weapon validation remains authoritative')

      - name: Validate Pass45 authored material/dependency closure contract
        run: python VERIFY_PASS45_WEAPON_MATERIAL_DEPENDENCY_AUDIT.py
