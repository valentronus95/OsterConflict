name: Production vehicle and grounded rack Pass 42

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/vehicle-assets-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vehicle-ground-rack-pass-42-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-42:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 42 production vehicles and grounded Museum rack
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_PRODUCTION_VEHICLE_GROUND_RACK_PASS_42.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
