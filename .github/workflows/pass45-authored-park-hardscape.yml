name: Pass 45 Authored Park Hardscape

on:
  push:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkHardscapeAuthoredUpgradeSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkHardscapeAuthoredUpgradeSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkSemanticOwnerNormalizationSubsystem.cpp'
      - 'OsterConflict/Content/AdvancedVillagePack/Meshes/SM_Plane_1x1.uasset'
      - 'OsterConflict/Content/Mega_Street_Props_Pack/Street_Props_pack_V2/Materials/Instances/M_Concrete_1_Inst.uasset'
      - 'VERIFY_PASS45_AUTHORED_PARK_HARDSCAPE.py'
      - 'RUN_ALL_VERIFY.py'
      - '.github/workflows/pass45-authored-park-hardscape.yml'
  pull_request:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkHardscapeAuthoredUpgradeSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkHardscapeAuthoredUpgradeSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkSemanticOwnerNormalizationSubsystem.cpp'
      - 'OsterConflict/Content/AdvancedVillagePack/Meshes/SM_Plane_1x1.uasset'
      - 'OsterConflict/Content/Mega_Street_Props_Pack/Street_Props_pack_V2/Materials/Instances/M_Concrete_1_Inst.uasset'
      - 'VERIFY_PASS45_AUTHORED_PARK_HARDSCAPE.py'
      - 'RUN_ALL_VERIFY.py'
      - '.github/workflows/pass45-authored-park-hardscape.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact authored park hardscape upgrade
        run: python VERIFY_PASS45_AUTHORED_PARK_HARDSCAPE.py
