name: Input recovery poll budget Pass 41

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/input-recovery-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: input-recovery-poll-budget-pass-41-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-41:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 41 adaptive input recovery polling
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_GAMEPLAY_INPUT_PASS_31.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_INPUT_RECOVERY_POLL_BUDGET_PASS_41.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python .\VERIFY_RUNTIME_ACCEPTANCE_PASS_33.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
