name: Content readiness Pass 19

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/content-readiness-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-readiness-pass-19-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-19:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 19 content readiness truth contracts
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_CONTENT_READINESS_PASS_19.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Recheck focused runtime recovery contract
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_RECOVERY_PASS_15.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
