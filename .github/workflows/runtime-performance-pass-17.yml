name: Runtime performance Pass 17

on:
  pull_request:
  push:
    branches:
      - main
      - 'fix/runtime-performance-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-performance-pass-17-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-pass-17:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 16 compatibility
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_GRAPHICS_PASS_16.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime performance Pass 17 source contracts
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_RUNTIME_PERFORMANCE_PASS_17.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
