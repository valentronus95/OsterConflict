name: Pass45 TZ ledger state sync

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-20260825
    paths:
      - .github/workflows/pass45-state-sync-patch.yml

permissions:
  contents: write

jobs:
  sync-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass45-runtime-rejection-20260825
          fetch-depth: 0

      - name: Synchronize Pass45 factual status
        shell: python
        run: |
          from pathlib import Path

          ledger_path = Path('OSTER_CONFLICT_WORK_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')

          replacements = {
              '13. [ ] Consolidate Museum visual ownership: R13.7 visible exterior vs R13.8 interaction/collision.':
                  '13. [x] Consolidate Museum visual ownership: R13.7 visible exterior; R13.8 hidden interaction/collision + final glass; obsolete R14.1 replacement owner deleted.',
              '14. [ ] Fix default M2 gunner pitch direction.':
                  '14. [x] Fix default M2 gunner pitch direction in source; factual runtime input proof remains required.',
              '15. [ ] Stop `AOCVehicleBase` legacy tint from touching production assets; then retire temporary production-material repair guard if possible.':
                  '15. [x] Stop `AOCVehicleBase` legacy tint from touching production assets; production visual guard converted to read-only validation with no repair/polling.',
              '| LOC-MUSEUM-001 | Correct visible Oster Local History Museum near BASE | ≥11 | IN_PROGRESS | R13.7/R13.8 duplicate-visible ownership now explicitly identified; consolidate exterior vs interaction. |':
                  '| LOC-MUSEUM-001 | Correct visible Oster Local History Museum near BASE | ≥11 | CODED_UNTESTED | R13.7 is the only visible exterior owner; R13.8 is hidden collision/final glass; late Pass32 repair mutation retired; factual screenshot still required. |',
              '| VEH-M2-PITCH-001 | Mouse up raises M2 when Invert Y OFF | 1 | IN_PROGRESS | Gunner pitch source path still requires correction + runtime test. |':
                  '| VEH-M2-PITCH-001 | Mouse up raises M2 when Invert Y OFF | 1 | CODED_UNTESTED | Source contract corrected; `PASS45_M2_GUNNER_PITCH_CONTRACT_READY` added; runtime input proof required. |',
              '| VEH-MATERIAL-OWNER-001 | Base vehicle tint must not overwrite production authored materials | 1 | IN_PROGRESS | Primary `OCVehicleBase::BeginPlay` legacy tint identified; guard remains temporary until primary fix. |':
                  '| VEH-MATERIAL-OWNER-001 | Base vehicle tint must not overwrite production authored materials | 1 | CODED_UNTESTED | `VehicleBase` bypasses `/Game/Production/`; former repair guard is read-only validation-only, no material mutation/polling. |',
          }
          for old, new in replacements.items():
              if old in ledger:
                  ledger = ledger.replace(old, new, 1)

          marker = '## Pass45 preserved local UE build/import rejection — 2026-08-25'
          if marker not in ledger:
              ledger += '''\n\n## Pass45 preserved local UE build/import rejection — 2026-08-25\n\nStatus of this historical attempt: **LOCAL UE BUILD REJECTED**. This is preserved as factual chronology even though a later corrected build reached gameplay.\n\n- UE 5.8/MSVC rejected the tactical-map `FVector2D` road table with **C2131** while it was `constexpr`; source now uses a normal `const` table.\n- UE 5.8 Interchange rejected the deprecated `auto_detect_mesh_type` property during HMMWV/M2 GLB intake; current importer explicitly forces StaticMesh through the supported Interchange API.\n- These source corrections remain **CODED_UNTESTED** as corrections to that failed attempt; a later run reaching gameplay does not erase the earlier failure record.\n- Current overall Pass45 truth remains **RUNTIME REJECTED / CORRECTIVE SOURCE WORK CODED_UNTESTED** until the next factual local UE 5.8 acceptance.\n\n### Museum layer ownership correction after audit\n\n- `OCMuseumLayerPerformanceGuardSubsystem` was found to be a conflicting late mutator: it could hide R13.7 visible shell components, remove source instances, alter collision/navigation and retune render state after the new Pass45 Museum owner had built.\n- It is now **validation-only**: one delayed observation, `mutation=0`, with `PASS45_MUSEUM_LAYER_VALIDATION_READY/FAIL`; any failure requires a primary-authoring fix instead of late repair.\n- R13.7 empty `WindowGlass`/`GreyDoors` prototype plumbing was removed; R13.7 owns visible exterior/trim/grilles only.\n- Runtime acceptance now requires `PASS45_MUSEUM_LAYER_VALIDATION_READY` and rejects `PASS45_MUSEUM_LAYER_VALIDATION_FAIL`; retired Pass30/Pass32 repair markers are no longer acceptance gates.\n- Production-model CI was forward-ported to Pass45 uniform/native-bounds HMMWV/BTR geometry rather than resurrecting non-uniform legacy fitting.\n'''
          ledger_path.write_text(ledger, encoding='utf-8')

          tz_path = Path('PASS45_RUNTIME_RECOVERY_TZ.md')
          tz = tz_path.read_text(encoding='utf-8')
          tz_marker = '### 8.1 Corrective owner audit extension — 2026-08-25'
          if tz_marker not in tz:
              tz += '''\n\n### 8.1 Corrective owner audit extension — 2026-08-25\n\nAll items below are **CODED_UNTESTED** until factual local UE runtime acceptance.\n\n- Museum ownership audit found a stale late mutation path in `OCMuseumLayerPerformanceGuardSubsystem`. The old Pass32 behavior could hide R13.7 visible components and repair/remove world state after authoritative startup, directly violating one-owner rules.\n- Current contract is validation-only: `R13.7 = visible exterior`, `R13.8 = hidden interaction collision + final breakable glass`; the layer validator may only observe and emit `PASS45_MUSEUM_LAYER_VALIDATION_READY/FAIL`, with `mutation=0` and `primary_authoring_fix_required=1` on failure.\n- R13.7 no longer creates even empty prototype glass/door components; obsolete visible/prototype ownership is removed at source rather than hidden later.\n- `RUN_R14_PLAYFLOW_PERFORMANCE_ACCEPTANCE.cmd` no longer requires retired Pass30 speculative-interior or Pass32 repair READY markers. It requires the current validation-only Museum evidence.\n- Production model integration CI now validates proportional native-bounds HMMWV/BTR grounding and explicitly rejects reintroduction of per-axis non-uniform fitting.\n- Historical local build failure remains preserved separately: **LOCAL UE BUILD REJECTED**, including tactical-map **C2131** and deprecated Interchange `auto_detect_mesh_type`; later source fixes do not erase that factual attempt.\n'''
          tz_path.write_text(tz, encoding='utf-8')

          report_path = Path('OsterConflict/Docs/WorkReports/PASS45_RUNTIME_RECOVERY_CORRECTIVE_2026-08-25_MUSEUM_VEHICLE.md')
          if report_path.is_file():
              report = report_path.read_text(encoding='utf-8')
              report_marker = '## Museum layer guard follow-up'
              if report_marker not in report:
                  report += '''\n\n## Museum layer guard follow-up\n\n- Found and retired the remaining Pass32 late Museum repair path. It could hide the current R13.7 visible exterior after authoritative startup.\n- `OCMuseumLayerPerformanceGuardSubsystem` is now one-shot validation-only and cannot mutate visibility, collision, instances, materials or cull state.\n- Removed empty R13.7 glass/door prototype plumbing and forward-ported runtime acceptance to `PASS45_MUSEUM_LAYER_VALIDATION_READY/FAIL`.\n- Production geometry workflow now checks Pass45 proportional native-bounds HMMWV/BTR fitting.\n- Status remains **CODED_UNTESTED / RUNTIME REJECTED** pending local UE 5.8 build/playtest.\n'''
                  report_path.write_text(report, encoding='utf-8')

      - name: Commit state sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OSTER_CONFLICT_WORK_LEDGER.md PASS45_RUNTIME_RECOVERY_TZ.md OsterConflict/Docs/WorkReports/PASS45_RUNTIME_RECOVERY_CORRECTIVE_2026-08-25_MUSEUM_VEHICLE.md
          git diff --cached --check
          git commit -m "docs(pass45): preserve build rejection and Museum validation state"
          git push origin HEAD:fix/pass45-runtime-rejection-20260825
