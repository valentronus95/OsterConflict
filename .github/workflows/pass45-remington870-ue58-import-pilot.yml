name: Pass 45 Remington 870 UE58 import pilot contract

on:
  push:
    paths:
      - 'PASS45_REMINGTON870_UE58_IMPORT_PILOT.py'
      - 'VERIFY_PASS45_REMINGTON870_UE58_IMPORT_PILOT.py'
      - 'SOURCE_ASSETS/PASS45/Remington870/MANIFEST.json'
      - 'OsterConflict/OsterConflict.uproject'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCFirstPersonWeaponPresentationSubsystem.cpp'
      - 'RUN_ALL_VERIFY.py'
      - '.github/workflows/pass45-remington870-ue58-import-pilot.yml'
  pull_request:
    paths:
      - 'PASS45_REMINGTON870_UE58_IMPORT_PILOT.py'
      - 'VERIFY_PASS45_REMINGTON870_UE58_IMPORT_PILOT.py'
      - 'SOURCE_ASSETS/PASS45/Remington870/MANIFEST.json'
      - 'OsterConflict/OsterConflict.uproject'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCFirstPersonWeaponPresentationSubsystem.cpp'
      - 'RUN_ALL_VERIFY.py'
      - '.github/workflows/pass45-remington870-ue58-import-pilot.yml'

permissions:
  contents: read

jobs:
  remington870-ue58-import-pilot-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source without Git LFS payload download
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Verify isolated UE58 import pilot source contract
        run: python VERIFY_PASS45_REMINGTON870_UE58_IMPORT_PILOT.py
