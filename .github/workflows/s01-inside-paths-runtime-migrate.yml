name: S01 inside paths runtime migration

on:
  push:
    branches:
      - r13-content-gameplay-pass
    paths:
      - Tools/apply_s01_inside_paths_runtime_migration.py
      - .github/workflows/s01-inside-paths-runtime-migrate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: r13-content-gameplay-pass
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic S01 inside-path migration
        run: python Tools/apply_s01_inside_paths_runtime_migration.py

      - name: Verify existing S01 guards
        run: |
          python VERIFY_R13_LOCATION_FIRST_S01.py
          python VERIFY_R13_LOCATION_FIRST_S01_VEGETATION_DATA.py
          python VERIFY_R13_LOCATION_FIRST_S01_VEGETATION_RUNTIME.py
          python VERIFY_R13_LOCATION_FIRST_S01_ROAD_TOPOLOGY.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit migrated runtime source
        shell: bash
        run: |
          if git diff --quiet -- OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp; then
            echo "S01 inside paths already migrated; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp
          git commit -m "Move S01 inside paths into road registry"
          git push origin HEAD:r13-content-gameplay-pass

# one-shot migration retrigger marker: v2
