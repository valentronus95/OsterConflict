name: R13 location-test migration

on:
  push:
    branches:
      - r13-content-gameplay-pass
    paths:
      - 'MIGRATE_R13_LOCATION_TEST_AND_MUSEUM_OWNERSHIP.py'
      - '.github/workflows/r13-location-test-migration.yml'
  pull_request:
    paths:
      - 'MIGRATE_R13_LOCATION_TEST_AND_MUSEUM_OWNERSHIP.py'
      - '.github/workflows/r13-location-test-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    # Deterministic one-shot migration; delete this workflow after the bot commit lands.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: r13-content-gameplay-pass
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic migration
        run: python MIGRATE_R13_LOCATION_TEST_AND_MUSEUM_OWNERSHIP.py

      - name: Verify migrated source
        run: |
          python VERIFY_R13_LOCATION_PLAYTEST_SAFETY.py
          python VERIFY_R11_VISUAL_FOUNDATION.py
          python VERIFY_R13_6_FRONTEND_AUDIO_LAYOUT.py
          python VERIFY_R13_7_MUSEUM_REPLACEMENT.py
          python VERIFY_R13_DYNAMIC_COOK_PATHS.py

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Migration produced no changes"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Public/OCGameMode.h \
                  OsterConflict/Source/OsterConflict/Private/OCGameMode.cpp \
                  OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp \
                  OsterConflict/Source/OsterConflict/Private/OCR13MuseumStadiumPhotoFidelitySubsystem.cpp \
                  OsterConflict/Source/OsterConflict/Private/OCR13FrontendAudioSubsystem.cpp \
                  VERIFY_R11_VISUAL_FOUNDATION.py \
                  VERIFY_R13_6_FRONTEND_AUDIO_LAYOUT.py
          git commit -m "Make local playtest location-first and museum-owned"
          git push origin HEAD:r13-content-gameplay-pass
