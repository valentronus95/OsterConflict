name: Pass 25 one-shot frontend input patch

on:
  push:
    branches:
      - fix/frontend-input-click-pass-25-use

permissions:
  contents: write

jobs:
  apply-pass25:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-input-click-pass-25-use
          fetch-depth: 0

      - name: Apply exact Pass 25 patch
        run: python tools/pass25_patch_frontend_input.py

      - name: Commit patched frontend
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Public/OCR13FrontendMenuSubsystem.h OsterConflict/Source/OsterConflict/Private/OCR13FrontendMenuSubsystem.cpp
          git diff --cached --quiet && exit 0
          git commit -m "Pass 25: arm frontend input once per menu lifecycle"
          git push origin HEAD:fix/frontend-input-click-pass-25-use
