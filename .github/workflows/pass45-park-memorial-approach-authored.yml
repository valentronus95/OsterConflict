name: Pass 45 Park Memorial Approach Authored

on:
  push:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkMemorialApproachAuthoredUpgradeSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkMemorialApproachAuthoredUpgradeSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualFidelityGateKSubsystem.cpp'
      - 'OsterConflict/Content/Mega_Street_Props_Pack/Street_Props_pack_V2/Meshes/SM_Curb_1.uasset'
      - 'VERIFY_PASS45_PARK_MEMORIAL_APPROACH_AUTHORED.py'
      - '.github/workflows/pass45-park-memorial-approach-authored.yml'
  pull_request:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkMemorialApproachAuthoredUpgradeSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkMemorialApproachAuthoredUpgradeSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualFidelityGateKSubsystem.cpp'
      - 'OsterConflict/Content/Mega_Street_Props_Pack/Street_Props_pack_V2/Meshes/SM_Curb_1.uasset'
      - 'VERIFY_PASS45_PARK_MEMORIAL_APPROACH_AUTHORED.py'
      - '.github/workflows/pass45-park-memorial-approach-authored.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify authored Central Park memorial approach
        run: python VERIFY_PASS45_PARK_MEMORIAL_APPROACH_AUTHORED.py
