name: Pass45 documentation state patch

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-20260825
    paths:
      - .github/workflows/pass45-doc-state-patch.yml

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass45-runtime-rejection-20260825
          fetch-depth: 0

      - name: Update canonical TZ and ledger
        shell: python
        run: |
          from pathlib import Path

          tz_path = Path('PASS45_RUNTIME_RECOVERY_TZ.md')
          tz = tz_path.read_text(encoding='utf-8')
          replacements = {
              '9. [ ] Audit/consolidate Museum `R137/R138/R140+`/CoreRecovery/Visibility/ownership mutation stack; delete obsolete shell owners.': '9. [x] Consolidate Museum ownership: R13.7 visible exterior; R13.8 hidden collision + final glass; R13.9/R14.0 final doors/facade; R14.5 sole tree owner; physically delete obsolete R14.1 window replacement.',
              '10. [ ] Correct default mounted M2 Browning pitch direction.': '10. [x] Correct default mounted M2 Browning pitch direction in source; runtime input proof still required.',
              '13. [ ] Forward-port/retire any additional stale verifiers discovered by the owner audit.': '13. [x] Forward-port stale production/Museum verifiers and lock deleted R14.1/material-repair owners out of current CI.',
              '14. [ ] Update work ledger with every legacy owner deletion/current replacement.': '14. [x] Update work ledger with Museum ownership, production-material, vehicle-transform and M2 pitch corrective state.',
          }
          for old, new in replacements.items():
              if old not in tz:
                  raise SystemExit(f'TZ signature missing: {old}')
              tz = tz.replace(old, new, 1)

          marker = '### Corrective source milestone — 2026-08-25 Museum/vehicle ownership\n'
          if marker not in tz:
              section = "\n".join([
                  '',
                  marker.rstrip(),
                  '',
                  'Current corrective source state is **CODED_UNTESTED**:',
                  '',
                  '- R13.7 is the single visible Museum exterior owner; prototype trees/static glass/static door slabs/wrong service prototype were removed from primary authoring.',
                  '- R13.8 owns hidden collision plus final `AOCMuseumBreakableWindow` glass only; generic prototype doors were removed.',
                  '- obsolete `OCR141MuseumWindowReplacementSubsystem` was physically deleted and removed from the startup coordinator.',
                  '- R14.0 no longer hides/removes R13.7 content late; R14.5 is the sole Museum tree-layout owner.',
                  '- `AOCVehicleBase` bypasses legacy BasicShape tinting for `/Game/Production/`; the production visual guard is validation-only.',
                  '- driver/gunner enter-exit paths now emit current-vehicle transform evidence with `museum_respawn_path=0`.',
                  '- mounted M2 default pitch source contract is mouse-up raises aim when invert-Y is off.',
                  '- detailed report: `OsterConflict/Docs/WorkReports/PASS45_RUNTIME_RECOVERY_CORRECTIVE_2026-08-25_MUSEUM_VEHICLE.md`.',
                  '',
                  'None of these source changes are runtime acceptance. Local UE 5.8 build/playtest remains mandatory.',
                  '',
              ])
              tz += section
          tz_path.write_text(tz, encoding='utf-8')

          ledger_path = Path('OSTER_CONFLICT_WORK_LEDGER.md')
          ledger = ledger_path.read_text(encoding='utf-8')
          ledger_marker = '## Pass45 corrective milestone — 2026-08-25 Museum/vehicle ownership'
          if ledger_marker not in ledger:
              ledger_section = "\n".join([
                  '',
                  ledger_marker,
                  '',
                  'Status: **CODED_UNTESTED / latest factual runtime remains RUNTIME REJECTED until a new local UE 5.8 run**.',
                  '',
                  '- Branch: `fix/pass45-runtime-rejection-20260825`.',
                  '- Museum visible ownership collapsed to R13.7; R13.8 is collision + final breakable glass only.',
                  '- obsolete R14.1 Museum window replacement header/source deleted; coordinator no longer invokes it.',
                  '- R14.0 late R13.7 suppression/instance removal retired; R14.5 owns the only current Museum tree layout.',
                  '- production VehicleBase no longer applies legacy BasicShape tint to `/Game/Production/`; validation guard is read-only.',
                  '- M2 gunner default pitch source corrected: invert off => mouse up raises aim.',
                  '- driver/gunner vehicle enter-exit transform telemetry added; normal path records `museum_respawn_path=0`.',
                  '- stale-retirement verifier forward-ported to reject resurrection of these removed owners/repair paths.',
                  '- Work report: `OsterConflict/Docs/WorkReports/PASS45_RUNTIME_RECOVERY_CORRECTIVE_2026-08-25_MUSEUM_VEHICLE.md`.',
                  '',
                  'Remaining factual acceptance: local UE build, Museum screenshot, vehicle drive/exit away from Museum, M2 pitch, HMMWV/M2/BTR materials/proportions, weapon material gaps, invalid Oster generic visuals, thermal/FPS behavior.',
                  '',
              ])
              ledger += ledger_section
          ledger_path.write_text(ledger, encoding='utf-8')

      - name: Commit canonical state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PASS45_RUNTIME_RECOVERY_TZ.md OSTER_CONFLICT_WORK_LEDGER.md
          git diff --cached --check
          git commit -m "docs(pass45): update canonical corrective state"
          git push origin HEAD:fix/pass45-runtime-rejection-20260825
