name: Pass 45 weapon audio fallback

on:
  pull_request:
    paths:
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAudioComponent.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCWeaponAudioComponent.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCWeaponAudioProfile.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCAudioTypes.h'
      - 'OsterConflict/Content/R13/Audio/**'
      - 'OsterConflict/Content/AK-47/Sound/**'
      - 'VERIFY_PASS45_WEAPON_AUDIO_FALLBACK.py'
      - 'PASS45_RUNTIME_RECOVERY_TZ.md'
      - '.github/workflows/pass45-weapon-audio-fallback.yml'
  push:
    branches:
      - main
      - 'fix/pass45-runtime-rejection-*'
    paths:
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAudioComponent.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCWeaponAudioComponent.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCWeaponAudioProfile.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCAudioTypes.h'
      - 'OsterConflict/Content/R13/Audio/**'
      - 'OsterConflict/Content/AK-47/Sound/**'
      - 'VERIFY_PASS45_WEAPON_AUDIO_FALLBACK.py'
      - 'PASS45_RUNTIME_RECOVERY_TZ.md'
      - '.github/workflows/pass45-weapon-audio-fallback.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify repository weapon audio fallback contracts
        run: python VERIFY_PASS45_WEAPON_AUDIO_FALLBACK.py
