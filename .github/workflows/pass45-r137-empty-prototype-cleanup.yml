name: Pass45 R13.7 empty prototype cleanup

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-20260825
    paths:
      - .github/workflows/pass45-r137-empty-prototype-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pass45-runtime-rejection-20260825
          fetch-depth: 0

      - name: Remove empty R13.7 glass and door prototype plumbing
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('OsterConflict/Source/OsterConflict/Private/OCR137MuseumPhotoModelSubsystem.cpp')
          text = path.read_text(encoding='utf-8')
          original = text

          # Breakable window actors own visible glass. Keep only trim/grille arguments in R13.7 helpers.
          text, n1 = re.subn(
              r'void AddFrontWindow\(UInstancedStaticMeshComponent\* Trim, UInstancedStaticMeshComponent\* Glass,\s*\n\s*UInstancedStaticMeshComponent\* Grille,',
              'void AddFrontWindow(UInstancedStaticMeshComponent* Trim, UInstancedStaticMeshComponent* Grille,',
              text,
              count=1,
          )
          text, n2 = re.subn(
              r'void AddSideWindow\(UInstancedStaticMeshComponent\* Trim, UInstancedStaticMeshComponent\* Glass,\s*\n\s*UInstancedStaticMeshComponent\* Grille,',
              'void AddSideWindow(UInstancedStaticMeshComponent* Trim, UInstancedStaticMeshComponent* Grille,',
              text,
              count=1,
          )
          if (n1, n2) != (1, 1):
              raise SystemExit(f'window helper signature mismatch front={n1} side={n2}')

          text = text.replace('AddFrontWindow(Trim, Glass, Grilles,', 'AddFrontWindow(Trim, Grilles,')
          text = text.replace('AddSideWindow(Trim, Glass, Grilles,', 'AddSideWindow(Trim, Grilles,')

          patterns = [
              (r'\s*UMaterialInterface\* GlassAsset = LoadObject<UMaterialInterface>\(nullptr,\s*\n\s*TEXT\("/Game/Modular_Rural_Cabin/Materials/Instances/Glass_Window\.Glass_Window"\)\);', 'GlassAsset load'),
              (r'\s*UMaterialInstanceDynamic\* RedGableWood = MakeColorMaterial\(Model, Basic, TEXT\("R137_RedGableWood"\),\s*\n\s*FLinearColor\([^;]+?\);', 'RedGableWood material'),
              (r'\s*UMaterialInstanceDynamic\* DoorMat = MakeColorMaterial\(Model, Basic, TEXT\("R137_Door"\),\s*\n\s*FLinearColor\([^;]+?\);', 'DoorMat material'),
              (r'\s*UMaterialInstanceDynamic\* GlassFallback = MakeColorMaterial\(Model, Basic, TEXT\("R137_GlassFallback"\),\s*\n\s*FLinearColor\([^;]+?\);', 'GlassFallback material'),
              (r'\s*UMaterialInterface\* GlassMaterial = GlassAsset \? GlassAsset : GlassFallback;', 'GlassMaterial alias'),
              (r'\s*UInstancedStaticMeshComponent\* Glass = MakeISM\(Model, Root, Cube, GlassMaterial,\s*\n\s*TEXT\("R137Museum_WindowGlass"\), false, false\);', 'WindowGlass component'),
              (r'\s*UInstancedStaticMeshComponent\* Doors = MakeISM\(Model, Root, Cube, DoorMat,\s*\n\s*TEXT\("R137Museum_GreyDoors"\), false, true\);', 'GreyDoors component'),
          ]
          for pattern, label in patterns:
              text, count = re.subn(pattern, '', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: replacements={count}')

          for forbidden in (
              'R137Museum_WindowGlass',
              'R137Museum_GreyDoors',
              'GlassMaterial',
              'GlassFallback',
              'DoorMat',
              'RedGableWood',
              'AddFrontWindow(Trim, Glass,',
              'AddSideWindow(Trim, Glass,',
          ):
              if forbidden in text:
                  raise SystemExit(f'stale R13.7 prototype token survived: {forbidden}')

          if text == original:
              raise SystemExit('R13.7 cleanup produced no changes')
          path.write_text(text, encoding='utf-8')

      - name: Commit source cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCR137MuseumPhotoModelSubsystem.cpp
          git diff --cached --check
          git commit -m "refactor(pass45): remove empty R13.7 glass door prototypes"
          git push origin HEAD:fix/pass45-runtime-rejection-20260825
