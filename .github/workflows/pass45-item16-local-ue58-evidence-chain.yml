name: Pass 45 item16 local UE58 evidence chain contract

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
    paths:
      - 'OsterConflict/RUN_PASS45_ITEM16_LOCAL_UE58_EVIDENCE.cmd'
      - 'VERIFY_PASS45_ITEM16_LOCAL_UE58_EVIDENCE_CHAIN.py'
      - 'OsterConflict/TRY_PASS45_M700_DERIVED_BOLT_TRANSLATION_UE58_PILOT.cmd'
      - 'OsterConflict/TRY_PASS45_REMINGTON870_DERIVED_PUMP_UE58_ASSEMBLY_AUDIT.cmd'
      - 'OsterConflict/TRY_PASS45_LEVERACTION_DERIVED_LEVER_UE58_PILOT.cmd'
      - 'OsterConflict/PASS45_IMPORT_MANUAL_ACTION_AUDIO_UE58.cmd'
      - 'PASS45_MANUAL_ACTION_AUDIO_UE_IMPORT.py'
      - 'PASS45_MANUAL_ACTION_AUDIO_UE_FRESH_LOAD.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAudioComponent.cpp'
      - '.github/workflows/pass45-item16-local-ue58-evidence-chain.yml'
  pull_request:
    paths:
      - 'OsterConflict/RUN_PASS45_ITEM16_LOCAL_UE58_EVIDENCE.cmd'
      - 'VERIFY_PASS45_ITEM16_LOCAL_UE58_EVIDENCE_CHAIN.py'
      - 'OsterConflict/TRY_PASS45_M700_DERIVED_BOLT_TRANSLATION_UE58_PILOT.cmd'
      - 'OsterConflict/TRY_PASS45_REMINGTON870_DERIVED_PUMP_UE58_ASSEMBLY_AUDIT.cmd'
      - 'OsterConflict/TRY_PASS45_LEVERACTION_DERIVED_LEVER_UE58_PILOT.cmd'
      - 'OsterConflict/PASS45_IMPORT_MANUAL_ACTION_AUDIO_UE58.cmd'
      - 'PASS45_MANUAL_ACTION_AUDIO_UE_IMPORT.py'
      - 'PASS45_MANUAL_ACTION_AUDIO_UE_FRESH_LOAD.py'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAnimationProfiles.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWeaponAudioComponent.cpp'
      - '.github/workflows/pass45-item16-local-ue58-evidence-chain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile item16 evidence-chain verifier
        run: python -m py_compile VERIFY_PASS45_ITEM16_LOCAL_UE58_EVIDENCE_CHAIN.py
      - name: Verify one-shot local UE58 evidence-chain safety contract
        run: python VERIFY_PASS45_ITEM16_LOCAL_UE58_EVIDENCE_CHAIN.py
