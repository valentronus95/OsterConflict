name: Pass 45 M700 derived bolt translation source

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
    paths:
      - 'PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py'
      - 'VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py'
      - 'PASS45_M700_SOURCE_MOTION_AUDIT.py'
      - 'PASS45_M700_BOLT_GEOMETRY_AUDIT.py'
      - '_DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json'
      - '_DOCS/PASS45_M700_BOLT_GEOMETRY_AUDIT_2026-09-02.json'
      - 'OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
      - '.github/workflows/pass45-m700-derived-bolt-translation-source.yml'
  pull_request:
    paths:
      - 'PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py'
      - 'VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py'
      - 'PASS45_M700_SOURCE_MOTION_AUDIT.py'
      - 'PASS45_M700_BOLT_GEOMETRY_AUDIT.py'
      - '_DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json'
      - '_DOCS/PASS45_M700_BOLT_GEOMETRY_AUDIT_2026-09-02.json'
      - 'OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
      - '.github/workflows/pass45-m700-derived-bolt-translation-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  derive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact Oster head without bulk LFS payload download
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Materialize only the pinned Stein M700 FBX
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
          git lfs install --local
          git lfs pull --include="$SOURCE" --exclude=''
          test -f "$SOURCE"
          if head -c 64 "$SOURCE" | grep -q 'git-lfs.github.com/spec'; then
            echo 'PASS45_M700_DERIVED_BOLT_SOURCE_LFS_POINTER_UNRESOLVED'
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import hashlib
          source = Path('OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx')
          payload = source.read_bytes()
          digest = hashlib.sha256(payload).hexdigest()
          assert len(payload) == 638732, len(payload)
          assert digest == 'b7e003e01be8441e452730bc06c38c5e9752e523ae1b401ed2a6cc6cdca16840', digest
          print(f'PASS45_M700_DERIVED_PINNED_SOURCE_OK size={len(payload)} sha256={digest}')
          PY

      - name: Compile derived-source tools
        run: python -m py_compile PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py

      - name: Install deterministic FBX inspection converter
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends assimp-utils
          assimp version

      - name: Convert exact M700 FBX to inspection-only glTF2
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='OsterConflict/Content/Raw/R13/Weapons/SteinClassicWeapons/WeaponsPack/M700/SKM_M700.fbx'
          GLTF='/tmp/pass45_m700_derived_source.gltf'
          assimp export "$SOURCE" "$GLTF" -f gltf2
          test -s "$GLTF"

      - name: Build deterministic calibration-only bolt translation cycle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _pass45_m700_derived
          python PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py \
            --gltf /tmp/pass45_m700_derived_source.gltf \
            --motion-audit _DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json \
            --geometry-audit _DOCS/PASS45_M700_BOLT_GEOMETRY_AUDIT_2026-09-02.json \
            --out-dir _pass45_m700_derived

      - name: Verify BOLT-only translation and explicit non-acceptance
        shell: bash
        run: |
          set -euo pipefail
          python VERIFY_PASS45_M700_DERIVED_BOLT_TRANSLATION_SOURCE.py \
            --gltf _pass45_m700_derived/m700_pass45_derived_bolt_translation.gltf \
            --manifest _pass45_m700_derived/PASS45_M700_DERIVED_BOLT_TRANSLATION_MANIFEST.json \
            --motion-audit _DOCS/PASS45_M700_SOURCE_MOTION_AUDIT_2026-09-02.json \
            --geometry-audit _DOCS/PASS45_M700_BOLT_GEOMETRY_AUDIT_2026-09-02.json

      - name: Preserve derived-source evidence only
        uses: actions/upload-artifact@v4
        with:
          name: pass45-m700-derived-bolt-translation-source-evidence
          path: _pass45_m700_derived/PASS45_M700_DERIVED_BOLT_TRANSLATION_MANIFEST.json
          if-no-files-found: error
          retention-days: 14
