name: One-shot Tactical Map runtime polish patch

on:
  push:
    branches:
      - fix/tactical-map-runtime-polish
    paths:
      - '.github/workflows/tactical-map-runtime-polish-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tactical-map-runtime-polish
          fetch-depth: 0

      - name: Apply exact runtime polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('OsterConflict/Source/OsterConflict/Private/OCTacticalMapSubsystem.cpp')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'if (ComponentName == TEXT("Ground") ||\n                ComponentName == TEXT("ReferenceMarkers") ||\n                ComponentName.Contains(TEXT("Label")))',
              'if (ComponentName == TEXT("Ground") ||\n                ComponentName == TEXT("Waterways") ||\n                ComponentName == TEXT("Bridges") ||\n                ComponentName == TEXT("ReferenceMarkers") ||\n                ComponentName.Contains(TEXT("Label")))',
              'default tactical framing excludes far-field hydro/bridge proxies')

          replace_once(
              '        WorldMapImage->SetBrush(MapBrush);\n',
              '        WorldMapImage->SetBrush(MapBrush);\n        WorldMapImage->SetColorAndOpacity(FLinearColor(0.34f, 0.40f, 0.36f, 1.0f));\n',
              'world capture tactical tint')

          replace_once(
              '    AddGrid();\n',
              '    UBorder* TacticalMapFilter = WidgetTree->ConstructWidget<UBorder>(UBorder::StaticClass(), TEXT("TacticalMapWorldFilter"));\n    TacticalMapFilter->SetBrushColor(FLinearColor(0.008f, 0.014f, 0.018f, 0.58f));\n    if (UCanvasPanelSlot* FilterCanvasSlot = MapContentCanvas->AddChildToCanvas(TacticalMapFilter))\n    {\n        FilterCanvasSlot->SetAnchors(FAnchors(0.0f, 0.0f, 1.0f, 1.0f));\n        FilterCanvasSlot->SetOffsets(FMargin(0.0f));\n        FilterCanvasSlot->SetZOrder(2);\n    }\n\n    AddGrid();\n',
              'dark tactical filter overlay')

          pattern = re.compile(r'void UOCTacticalMapWidget::AddLandmarkMarker\(const FString& Label, const FVector& WorldLocation\)\n\{.*?\n\}\n\nvoid UOCTacticalMapWidget::AddGrid\(\)', re.S)
          replacement = '''void UOCTacticalMapWidget::AddLandmarkMarker(const FString& Label, const FVector& WorldLocation)
{
    if (!WidgetTree || !MapContentCanvas) return;

    const FVector2D Anchor = WorldToMap(WorldLocation);
    FVector2D LabelOffset(18.0f, -12.0f);
    if (Label == TEXT("ЦЕНТР")) LabelOffset = FVector2D(-118.0f, -34.0f);
    else if (Label == TEXT("СІЛЬПО")) LabelOffset = FVector2D(-118.0f, 10.0f);
    else if (Label == TEXT("МУЗЕЙ")) LabelOffset = FVector2D(18.0f, -30.0f);
    else if (Label == TEXT("СТАДІОН")) LabelOffset = FVector2D(18.0f, 12.0f);
    else if (Label == TEXT("ПАРК")) LabelOffset = FVector2D(-106.0f, -28.0f);

    UTextBlock* Dot = WidgetTree->ConstructWidget<UTextBlock>();
    Dot->SetText(FText::FromString(TEXT("•")));
    Dot->SetColorAndOpacity(FSlateColor(FLinearColor(0.80f, 0.85f, 0.86f, 0.95f)));
    Dot->SetJustification(ETextJustify::Center);
    SetTextSize(Dot, 12);
    PlaceOnCanvas(MapContentCanvas, Dot, Anchor, FVector2D(18.0f, 18.0f), FVector2D(0.5f, 0.5f), 12);

    UBorder* Chip = WidgetTree->ConstructWidget<UBorder>();
    Chip->SetBrushColor(FLinearColor(0.010f, 0.016f, 0.020f, 0.84f));
    Chip->SetPadding(FMargin(6.0f, 2.0f, 6.0f, 2.0f));

    UTextBlock* Text = WidgetTree->ConstructWidget<UTextBlock>();
    Text->SetText(FText::FromString(Label));
    Text->SetColorAndOpacity(FSlateColor(FLinearColor(0.84f, 0.88f, 0.89f, 1.0f)));
    SetTextSize(Text, 10);
    Chip->SetContent(Text);

    PlaceOnCanvas(MapContentCanvas, Chip, Anchor + LabelOffset, FVector2D(94.0f, 22.0f), FVector2D::ZeroVector, 13);
}

void UOCTacticalMapWidget::AddGrid()'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'landmark chip rewrite: expected one function, got {count}')

          replace_once(
              '            SetTextSize(Marker, 17);\n            PlaceOnCanvas(MapContentCanvas, Marker, FVector2D::ZeroVector, FVector2D(130.0f, 32.0f),',
              '            SetTextSize(Marker, 12);\n            PlaceOnCanvas(MapContentCanvas, Marker, FVector2D::ZeroVector, FVector2D(92.0f, 24.0f),',
              'compact objective markers')

          replace_once(
              '        Marker->SetText(FText::FromString(FString::Printf(\n            TEXT("◆ %s"), Ping.IssuerName.IsEmpty() ? TEXT("PING") : *Ping.IssuerName)));',
              '        Marker->SetText(FText::FromString(TEXT("◆ МІТКА")));',
              'network tactical ping label')

          text = text.replace('TEXT("◆ PING")', 'TEXT("◆ МІТКА")')

          footer_old = '''    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintClose"), TEXT("M  ЗАКРИТИ"),
        FVector2D(38.0f, 846.0f), FVector2D(180.0f, 28.0f), 14, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintZoom"), TEXT("КОЛЕСО  МАСШТАБ"),
        FVector2D(315.0f, 846.0f), FVector2D(230.0f, 28.0f), 14, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintPan"), TEXT("ЛКМ + РУХ  ПЕРЕМІЩЕННЯ"),
        FVector2D(650.0f, 846.0f), FVector2D(320.0f, 28.0f), 14, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintPing"), TEXT("ПКМ  ТАКТИЧНИЙ МАРКЕР"),
        FVector2D(1175.0f, 846.0f), FVector2D(340.0f, 28.0f), 14, ColorMutedText, 5);'''
          footer_new = '''    UBorder* FooterPanel = WidgetTree->ConstructWidget<UBorder>(UBorder::StaticClass(), TEXT("TacticalMapFooterPanel"));
    FooterPanel->SetBrushColor(FLinearColor(0.025f, 0.032f, 0.038f, 0.98f));
    PlaceOnCanvas(Root, FooterPanel, FVector2D(20.0f, 806.0f), FVector2D(1543.0f, 46.0f), FVector2D::ZeroVector, 3);

    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintClose"), TEXT("M  ЗАКРИТИ"),
        FVector2D(38.0f, 819.0f), FVector2D(180.0f, 22.0f), 11, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintZoom"), TEXT("КОЛЕСО  МАСШТАБ"),
        FVector2D(315.0f, 819.0f), FVector2D(230.0f, 22.0f), 11, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintPan"), TEXT("ЛКМ + РУХ  ПЕРЕМІЩЕННЯ"),
        FVector2D(650.0f, 819.0f), FVector2D(320.0f, 22.0f), 11, ColorMutedText, 5);
    AddCanvasText(WidgetTree, Root, TEXT("TacticalMapHintPing"), TEXT("ПКМ  ПОСТАВИТИ МІТКУ"),
        FVector2D(1180.0f, 819.0f), FVector2D(330.0f, 22.0f), 11, ColorMutedText, 5);'''
          replace_once(footer_old, footer_new, 'safe footer bar')

          path.write_text(text, encoding='utf-8', newline='\n')
          print('Tactical Map runtime polish patch applied.')
          PY

          git diff --check
          python ./VERIFY_TACTICAL_MAP_V2.py
          python ./VERIFY_TACTICAL_MAP_INPUT_SAFETY.py

      - name: Commit runtime polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCTacticalMapSubsystem.cpp
          git commit -m "Polish Tactical Map runtime readability"
          git push origin HEAD:fix/tactical-map-runtime-polish

# retrigger 2026-08-22 runtime screenshot fixes
