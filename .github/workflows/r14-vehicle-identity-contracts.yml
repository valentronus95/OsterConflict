name: R14 vehicle identity contracts

on:
  pull_request:
    paths:
      - '.github/workflows/r14-vehicle-identity-contracts.yml'
      - 'OsterConflict/Source/OsterConflict/Public/OCPickupGunTruck.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCHMMWVGunTruck.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCPickupGunTruck.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCCombatVehicleSpawnPoints.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCCombatVehicleSpawnPoints.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionVehicleRuntimeValidationSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCGameMode.cpp'
      - 'R14_MODEL_REGISTRY.md'
  push:
    branches:
      - feat/r14-production-models
    paths:
      - '.github/workflows/r14-vehicle-identity-contracts.yml'
      - 'OsterConflict/Source/OsterConflict/Public/OCPickupGunTruck.h'
      - 'OsterConflict/Source/OsterConflict/Public/OCHMMWVGunTruck.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCPickupGunTruck.cpp'
      - 'OsterConflict/Source/OsterConflict/Public/OCCombatVehicleSpawnPoints.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCCombatVehicleSpawnPoints.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCProductionVehicleRuntimeValidationSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCGameMode.cpp'
      - 'R14_MODEL_REGISTRY.md'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Validate distinct combat vehicle identities
        shell: python
        run: |
          from pathlib import Path
          import sys

          failures = []
          def require(condition, message):
              if not condition:
                  failures.append(message)

          pickup_h = Path('OsterConflict/Source/OsterConflict/Public/OCPickupGunTruck.h').read_text(encoding='utf-8')
          hmmwv_h = Path('OsterConflict/Source/OsterConflict/Public/OCHMMWVGunTruck.h').read_text(encoding='utf-8')
          pickup_cpp = Path('OsterConflict/Source/OsterConflict/Private/OCPickupGunTruck.cpp').read_text(encoding='utf-8')
          spawn_h = Path('OsterConflict/Source/OsterConflict/Public/OCCombatVehicleSpawnPoints.h').read_text(encoding='utf-8')
          spawn_cpp = Path('OsterConflict/Source/OsterConflict/Private/OCCombatVehicleSpawnPoints.cpp').read_text(encoding='utf-8')
          runtime = Path('OsterConflict/Source/OsterConflict/Private/OCProductionVehicleRuntimeValidationSubsystem.cpp').read_text(encoding='utf-8')
          game_mode = Path('OsterConflict/Source/OsterConflict/Private/OCGameMode.cpp').read_text(encoding='utf-8')

          require('ShouldUseHMMWVProductionVisual() const { return false; }' in pickup_h,
                  'base armed pickup can silently identify itself as HMMWV')
          require('class OSTERCONFLICT_API AOCHMMWVGunTruck : public AOCPickupGunTruck' in hmmwv_h,
                  'dedicated HMMWV gun-truck class is missing')
          require('ShouldUseHMMWVProductionVisual() const override { return true; }' in hmmwv_h,
                  'HMMWV subclass no longer explicitly selects HMMWV shell')

          require('ShouldUseHMMWVProductionVisual()' in pickup_cpp,
                  'vehicle style no longer branches on explicit vehicle identity')
          require('/Game/Production/Vehicles/HMMWV/SM_HMMWV_UA.SM_HMMWV_UA' in pickup_cpp,
                  'HMMWV canonical shell path changed')
          require('/Game/VehicleVarietyPack/Meshes/SM_Pickup.SM_Pickup' in pickup_cpp,
                  'armed pickup canonical shell path changed')
          require('/Game/Production/Weapons/M2/SM_M2_Browning.SM_M2_Browning' in pickup_cpp,
                  'shared mounted M2 canonical path changed')

          require('AOCProductionPickupGunTruckSpawnPoint' in spawn_h and
                  'AOCHMMWVGunTruckSpawnPoint' in spawn_h,
                  'explicit HMMWV/pickup spawn-point types are incomplete')
          require('AOCPickupGunTruckSpawnPoint::AOCPickupGunTruckSpawnPoint()' in spawn_cpp and
                  'VehicleClass = AOCHMMWVGunTruck::StaticClass();' in spawn_cpp,
                  'legacy combat-fleet spawn no longer preserves current HMMWV behavior')
          require('AOCProductionPickupGunTruckSpawnPoint::AOCProductionPickupGunTruckSpawnPoint()' in spawn_cpp and
                  'VehicleClass = AOCPickupGunTruck::StaticClass();' in spawn_cpp,
                  'explicit armed-pickup spawn no longer maps to pickup class')

          require('GetWorld()->SpawnActor<AOCPickupGunTruckSpawnPoint>' in game_mode,
                  'normal combat fleet source unexpectedly changed spawn count/distribution')

          require('PickupAssetPath' in runtime and '/Game/VehicleVarietyPack/Meshes/SM_Pickup.SM_Pickup' in runtime,
                  'runtime validator no longer validates armed pickup shell')
          require('GunTruck->IsA<AOCHMMWVGunTruck>()' in runtime,
                  'runtime validator no longer distinguishes HMMWV subclass from pickup')
          require('HMMWVGunTrucksUsingHMMWV' in runtime and 'PickupGunTrucksUsingPickup' in runtime,
                  'runtime validator lost separate HMMWV/pickup counters')
          require('bHMMWVRuntimePass' in runtime and 'bPickupRuntimePass' in runtime and 'bM2RuntimePass' in runtime,
                  'runtime vehicle identity gates are incomplete')

          if failures:
              print('R14 vehicle identity contracts FAILED:')
              for failure in failures:
                  print(f' - {failure}')
              sys.exit(1)

          print('R14 vehicle identity contracts PASS')
