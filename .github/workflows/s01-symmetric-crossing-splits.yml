name: S01 symmetric crossing splits

on:
  push:
    branches:
      - r13-content-gameplay-pass
    paths:
      - Tools/apply_s01_symmetric_crossing_splits.py
      - .github/workflows/s01-symmetric-crossing-splits.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: r13-content-gameplay-pass
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply deterministic symmetric crossing splits
        run: python Tools/apply_s01_symmetric_crossing_splits.py

      - name: Verify stable S01 guards
        run: |
          python VERIFY_R13_LOCATION_FIRST_S01.py
          python VERIFY_R13_LOCATION_FIRST_S01_VEGETATION_DATA.py
          python VERIFY_R13_LOCATION_FIRST_S01_VEGETATION_RUNTIME.py

      - name: Check patch hygiene
        run: git diff --check

      - name: Commit split runtime source
        shell: bash
        run: |
          if git diff --quiet -- OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp; then
            echo "S01 symmetric crossings already split; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp
          git commit -m "Split symmetric S01 road crossings by ownership"
          git push origin HEAD:r13-content-gameplay-pass
