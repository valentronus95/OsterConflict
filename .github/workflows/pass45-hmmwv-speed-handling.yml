name: Pass 45 HMMWV speed handling

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
  pull_request:

jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify HMMWV speed and handling calibration
        run: python VERIFY_PASS45_HMMWV_SPEED_HANDLING.py
