name: Align Pass 30 legacy verifiers

on:
  push:
    branches:
      - fix/museum-spawn-perf-pass-30-20260823

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Pass 30 verifier alignment') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/museum-spawn-perf-pass-30-20260823
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Align legacy verifiers
        run: python PATCH_PASS30_LEGACY_VERIFIERS.py
      - name: Commit verifier alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERIFY_OSTER_WORLD_MODELS_PASS.py VERIFY_RUNTIME_ACCEPTANCE_PASS_7.py VERIFY_RUNTIME_RECONCILE_PASS_8.py VERIFY_RUNTIME_ACCEPTANCE_PASS_2.py
          git commit -m "Apply Pass 30 verifier alignment"
          git push origin HEAD:fix/museum-spawn-perf-pass-30-20260823
