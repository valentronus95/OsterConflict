name: One-shot Tactical Map ledger update

on:
  push:
    branches:
      - feat/tactical-map-v2
    paths:
      - '.github/workflows/tactical-map-one-shot-ledger-update.yml'

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tactical-map-v2
          fetch-depth: 0

      - name: Update exact Tactical Map ledger rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('OSTER_CONFLICT_WORK_LEDGER.md')
          text = path.read_text(encoding='utf-8')

          old_requirement = '| UI-TACTICAL-MAP-001 | `M` tactical map без конфлікту | 1 | IN_PROGRESS | Tactical-map subsystem перехоплює `M` і runtime remap-ить engineer DeployTrap на `V`. Але `OCCharacter` default mapping і старий HUD hint ще містять `M` для trap, тому source consistency cleanup лишається. Runtime guard уже є; потрібен один остаточний contract. |'
          new_requirement = '| UI-TACTICAL-MAP-001 | `M` tactical map без конфлікту | 1 | CODED_UNTESTED | PR #18: `M` тепер canonical Tactical Map key через Enhanced Input; `OCCharacter` default DeployTrap = `V`, HUD показує `V DEPLOY`; map-owned input lock скидається навіть при blocking UI, drag має mouse capture/release. Sync `63406c0...` включає `main f02cdef...`; Tactical Map CI #87 і key/input contract CI #93 — PASS. Потрібні фактичний UE 5.8 build і runtime acceptance. |'

          old_technical = '| TACTICAL-MAP-SOURCE-001 | `M` map, runtime guard `V` trap | CODED_UNTESTED / CLEANUP OPEN | `a6d31480...`, `d9d36c1...`, build fix `bb7d49b5...`; tactical subsystem remap guard є, constructor/HUD consistency ще треба дочистити. |'
          new_technical = '| TACTICAL-MAP-SOURCE-001 | `M` map, `V` trap canonical | CODED_UNTESTED | PR #18: `599d488...` input-lock/drag safety; `b603621...` constructor + HUD key consistency; `33be351...` UE 5.8 build helper hardening; `63406c0...` sync з `main f02cdef...`. Tactical Map source/input CI #93 — PASS; реальний UE 5.8 compile/runtime ще не підтверджено. |'

          for old, new in ((old_requirement, new_requirement), (old_technical, new_technical)):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one ledger row, found {count}: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          print('Tactical Map ledger rows updated.')
          PY
          git diff --check
          git diff -- OSTER_CONFLICT_WORK_LEDGER.md

      - name: Commit ledger update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OSTER_CONFLICT_WORK_LEDGER.md
          git commit -m "Record Tactical Map source-ready status"
          git push origin HEAD:feat/tactical-map-v2
