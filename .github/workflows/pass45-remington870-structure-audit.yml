name: Pass 45 Remington 870 structure audit

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
    paths:
      - 'PASS45_REMINGTON870_STRUCTURE_AUDIT.py'
      - 'PASS45_REMINGTON870_REMOTE_CANDIDATE_AUDIT.py'
      - 'PASS45_REMINGTON870_SOURCE_ACQUIRE.py'
      - '.github/workflows/pass45-remington870-structure-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-pinned-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Oster head without LFS payload download
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit exact pinned donor hierarchy and geometry
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='_DOCS/PASS45_REMINGTON870_STRUCTURE_AUDIT_2026-09-02.json'
          python PASS45_REMINGTON870_STRUCTURE_AUDIT.py --output "$OUTPUT"
          cat "$OUTPUT"
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('_DOCS/PASS45_REMINGTON870_STRUCTURE_AUDIT_2026-09-02.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          if doc.get('source_sha256') != '147aa6a0b167ba3f0806ad19a1cb6cc8790a0d541079f54d2e0fa8cf829954a2':
              raise SystemExit('structure audit source SHA-256 drifted')
          if doc.get('status') != 'STRUCTURAL_GEOMETRY_EVIDENCE_ONLY':
              raise SystemExit('structure audit falsely changed status')
          if doc.get('pump_node_identity') != 'UNPROVEN':
              raise SystemExit('structure audit falsely claims pump identity')
          if doc.get('standalone_pump_clip') != 'UNPROVEN':
              raise SystemExit('structure audit falsely claims standalone pump clip')
          if doc.get('ue58_import_pending') is not True:
              raise SystemExit('structure audit falsely clears UE 5.8 import pending')
          if doc.get('runtime_acceptance') is not False or doc.get('item16_checked') is not False:
              raise SystemExit('structure audit falsely claims runtime/item16 acceptance')
          required = {'Rif_059', 'Trigger_060', 'PBody_058', 'Pmag_061'}
          if set((doc.get('targets') or {}).keys()) != required:
              raise SystemExit('structure audit target set drifted')
          print('PASS45_REMINGTON870_STRUCTURE_AUDIT_JSON_OK runtime_acceptance=0 item16_checked=0')
          PY

      - name: Commit audit only if canonical head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT='_DOCS/PASS45_REMINGTON870_STRUCTURE_AUDIT_2026-09-02.json'
          git add "$OUTPUT"
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          if [[ "$REMOTE_HEAD" != "$GITHUB_SHA" ]]; then
            echo "PASS45_REMINGTON870_STRUCTURE_AUDIT_HEAD_MOVED expected=$GITHUB_SHA actual=$REMOTE_HEAD"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'PASS45_REMINGTON870_STRUCTURE_AUDIT_NO_CHANGES'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(pass45): persist Remington structure audit'
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve structure audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: pass45-remington870-structure-audit
          path: _DOCS/PASS45_REMINGTON870_STRUCTURE_AUDIT_2026-09-02.json
          if-no-files-found: error
          retention-days: 3
