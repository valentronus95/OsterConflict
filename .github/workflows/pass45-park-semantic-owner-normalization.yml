name: Pass 45 Park Semantic Owner Normalization

on:
  push:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkSemanticOwnerNormalizationSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkSemanticOwnerNormalizationSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualFidelityGateKSubsystem.cpp'
      - 'VERIFY_PASS45_PARK_SEMANTIC_OWNER_NORMALIZATION.py'
      - '.github/workflows/pass45-park-semantic-owner-normalization.yml'
  pull_request:
    paths:
      - 'OsterConflict/Source/OsterConflict/Public/OCParkSemanticOwnerNormalizationSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCParkSemanticOwnerNormalizationSubsystem.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldSectorOster.cpp'
      - 'OsterConflict/Source/OsterConflict/Private/OCVisualFidelityGateKSubsystem.cpp'
      - 'VERIFY_PASS45_PARK_SEMANTIC_OWNER_NORMALIZATION.py'
      - '.github/workflows/pass45-park-semantic-owner-normalization.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Central Park semantic owner normalization bridge
        run: python VERIFY_PASS45_PARK_SEMANTIC_OWNER_NORMALIZATION.py
