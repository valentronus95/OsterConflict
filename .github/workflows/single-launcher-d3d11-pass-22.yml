name: Single launcher D3D11 Pass 22

on:
  pull_request:
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'RUN_R21_LANDMARK_OWNERSHIP_RUNTIME_ACCEPTANCE.cmd'
      - 'VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - '.github/workflows/single-launcher-d3d11-pass-22.yml'
  push:
    branches:
      - main
    paths:
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'RUN_R21_LANDMARK_OWNERSHIP_RUNTIME_ACCEPTANCE.cmd'
      - 'VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - '.github/workflows/single-launcher-d3d11-pass-22.yml'

jobs:
  verify-pass-22:
    runs-on: windows-latest
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Pass 20 normal route compatibility
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_NORMAL_GAME_ROUTE_PASS_20.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single launcher and D3D11 Pass 22
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
