name: DX11 SM5 render-target startup Pass 23

on:
  pull_request:
    paths:
      - 'OsterConflict/Config/DefaultEngine.ini'
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py'
      - 'VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - '.github/workflows/dx11-sm5-render-target-pass-23.yml'
  push:
    branches:
      - main
    paths:
      - 'OsterConflict/Config/DefaultEngine.ini'
      - 'START_HERE.cmd'
      - 'RUN_R14_CURRENT_GAMEPLAY.cmd'
      - 'RUN_R15_RUNTIME_RECOVERY_ACCEPTANCE.cmd'
      - 'VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py'
      - 'VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py'
      - 'VERIFY_NORMAL_GAME_ROUTE_PASS_20.py'
      - '.github/workflows/dx11-sm5-render-target-pass-23.yml'

jobs:
  verify-pass-23:
    runs-on: windows-latest
    steps:
      - name: Checkout source without LFS payloads
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify normal game route Pass 20
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_NORMAL_GAME_ROUTE_PASS_20.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify single launcher Pass 22
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_SINGLE_LAUNCHER_D3D11_PASS_22.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify DX11 SM5 startup Pass 23
        shell: pwsh
        run: |
          $env:PYTHONUTF8='1'
          $env:PYTHONIOENCODING='utf-8'
          python .\VERIFY_DX11_SM5_RENDER_TARGET_PASS_23.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
