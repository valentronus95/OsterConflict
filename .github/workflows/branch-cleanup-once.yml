name: One-shot remote branch cleanup

on:
  push:
    branches:
      - fix/pass45-runtime-rejection-material-closure-20260826
    paths:
      - '.github/workflows/branch-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete final stale branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          for branch in \
            tmp-do-not-use-2 \
            tmp-pass45-consolidation-safety-20260828 \
            tmp-pass45-museum-site-context-20260828
          do
            echo "DELETE $branch"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}" || true
          done
          echo "Remaining branches:"
          gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name'

      - name: Remove this one-shot workflow from the branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: fix/pass45-runtime-rejection-material-closure-20260826
          FILE: .github/workflows/branch-cleanup-once.yml
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${REPO}/contents/${FILE}?ref=${BRANCH}" --jq '.sha')
          gh api --method DELETE "repos/${REPO}/contents/${FILE}" \
            -f message='Remove one-shot branch cleanup workflow' \
            -f sha="$SHA" \
            -f branch="$BRANCH"
