name: Pass 45 completion audit

on:
  push:
    branches:
      - fix/pass45-completion-audit-20260825
      - main
  pull_request:
    paths:
      - 'PASS45_RUNTIME_RECOVERY_TZ.md'
      - 'OSTER_CONFLICT_WORK_LEDGER.md'
      - 'VERIFY_PASS45_COMPLETION_AUDIT.py'
      - 'RUN_ALL_VERIFY.py'
      - 'OsterConflict/Docs/WorkReports/PASS45_COMPLETION_AUDIT_2026-08-25.md'
      - 'OsterConflict/Source/OsterConflict/Public/OCWorldProductionVisualsSubsystem.h'
      - 'OsterConflict/Source/OsterConflict/Private/OCWorldProductionVisualsSubsystem.cpp'
      - 'OsterConflict/Content/AdvancedVillagePack/**'
      - 'OsterConflict/Content/Scene_RoadsideConstruction/**'

jobs:
  source-completion-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Pass 45 completion audit
        run: python VERIFY_PASS45_COMPLETION_AUDIT.py
      - name: Verify active Pass 45 recovery contract
        run: python VERIFY_RUNTIME_RECOVERY_PASS_45.py
